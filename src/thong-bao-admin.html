<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-admin-css" rel="stylesheet" href="assets/css/sidebar-admin.css">
    <style>
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-purple), var(--primary-blue));
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            border-radius: 0 0 0 100%;
            opacity: 0.1;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .stat-card.total::before {
            background: #3498db;
        }

        .stat-card.pending::before {
            background: #f39c12;
        }

        .stat-card.completed::before {
            background: #2ecc71;
        }

        .stat-card.cancelled::before {
            background: #9b59b6;
        }

        .stat-card.total::after {
            background: #3498db;
        }

        .stat-card.pending::after {
            background: #f39c12;
        }

        .stat-card.completed::after {
            background: #2ecc71;
        }

        .stat-card.cancelled::after {
            background: #9b59b6;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            margin: 0 0 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(0, 174, 239, 0.1));
            color: var(--primary-purple);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .filter-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .search-box input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898aa;
        }

        .form-select {
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .notifications-container {
            margin: 20px 0;
        }

        .notification-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .notification-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .notification-item.unread {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            right: 20px;
            top: 20px;
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .notification-type {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .notification-type.leave {
            background: #fff3cd;
            color: #856404;
        }

        .notification-type.cancel {
            background: #f8d7da;
            color: #721c24;
        }

        .notification-type.password {
            background: #e7d5ff;
            color: #6b21a8;
        }

        .notification-time {
            color: #6c757d;
            font-size: 0.85rem;
        }

        .notification-content {
            margin: 10px 0;
        }

        .notification-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .notification-text {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .notification-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e9ecef;
        }

        .notification-detail {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .notification-detail i {
            color: #667eea;
        }

        .notification-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-notif-action {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-approve {
            background: #28a745;
            color: white;
        }

        .btn-approve:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-reject {
            background: #ffc107;
            color: #333;
        }

        .btn-reject:hover {
            background: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .btn-notif-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .password-request-info {
            background: #f8f4ff;
            border: 1px solid #e7d5ff;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .password-request-info .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.9rem;
        }

        .password-request-info .info-row:last-child {
            margin-bottom: 0;
        }

        .password-request-info i {
            color: #9b59b6;
            width: 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.processed {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-purple);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-purple);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        @media (max-width: 768px) {

            .stats-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .section-card {
                padding: 15px;
            }

            .filter-bar {
                padding: 15px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .notification-item {
                padding: 15px;
            }

            .notification-header {
                flex-direction: column;
                gap: 10px;
            }

            .notification-details {
                flex-direction: column;
                gap: 8px;
            }

            .notification-actions {
                flex-direction: column;
            }

            .btn-notif-action {
                width: 100%;
                justify-content: center;
            }

            .pagination-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="stats-row">
            <div class="stat-card total">
                <div class="stat-icon"><i class="fas fa-bell"></i></div>
                <div class="stat-number" id="totalNotifications">0</div>
                <div class="stat-label">Tổng thông báo</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon"><i class="fas fa-envelope"></i></div>
                <div class="stat-number" id="unreadNotifications">0</div>
                <div class="stat-label">Chưa đọc</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-icon"><i class="fas fa-calendar-plus"></i></div>
                <div class="stat-number" id="leaveNotifications">0</div>
                <div class="stat-label">Nghỉ phép</div>
            </div>
            <div class="stat-card cancelled">
                <div class="stat-icon"><i class="fas fa-key"></i></div>
                <div class="stat-number" id="passwordResetNotifications">0</div>
                <div class="stat-label">Cấp lại mật khẩu</div>
            </div>
        </div>

        <div class="section-card">
            <div class="card-header">
                <h5><i class="fas fa-list me-2"></i>Danh sách thông báo</h5>
                <div class="header-actions">
                    <button class="btn btn-sm btn-outline-primary" onclick="markAllAsRead()"
                        title="Đánh dấu tất cả đã đọc">
                        <i class="fas fa-check-double"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteAllRead()" title="Xóa đã đọc">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-5">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" class="form-control" id="searchInput" placeholder="Tìm kiếm thông báo..."
                                oninput="applyFilters()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="typeFilter" onchange="applyFilters()">
                            <option value="">Tất cả loại</option>
                            <option value="Nghỉ phép">Nghỉ phép</option>
                            <option value="Hủy nghỉ">Hủy nghỉ</option>
                            <option value="Cấp lại mật khẩu">Cấp lại mật khẩu</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="statusFilter" onchange="applyFilters()">
                            <option value="">Tất cả</option>
                            <option value="unread">Chưa đọc</option>
                            <option value="read">Đã đọc</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" onclick="resetFilters()">
                            <i class="fas fa-redo me-1"></i>Đặt lại
                        </button>
                    </div>
                </div>
            </div>

            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải...</p>
            </div>

            <div class="notifications-container" id="notificationsList"></div>

            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 thông báo</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/config-admin.js"></script>
    <script src="assets/js/sidebar-admin.js"></script>
    <script>
        let currentPage = 1;
        const itemsPerPage = 10;
        let allNotifications = [];
        let filteredNotifications = [];
        let autoRefreshInterval;
        let lastNotificationCount = 0;

        document.addEventListener('DOMContentLoaded', function () {
            markPageAsViewed();
            loadNotifications();
            startAutoRefresh();

            // Mobile menu
            // Scroll to top
            window.onscroll = () => {
                const btn = document.getElementById('scrollTopBtn');
                btn.style.display = (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) ? 'flex' : 'none';
            };

            window.addEventListener('beforeunload', () => {
                stopAutoRefresh();
            });
        });

        function markPageAsViewed() {
            fetch(`${API_BASE_ADMIN}/mark-admin-notifications-viewed.php`, {
                method: 'POST',
                credentials: 'include'
            });
        }

        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                loadNotifications(true);
            }, 5000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        }

        async function loadNotifications(silent = false) {
            if (!silent) showLoading(true);

            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-admin-notifications.php`, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    const newCount = data.data.filter(n => !n.daXem).length;

                    if (!silent && newCount > lastNotificationCount && lastNotificationCount > 0) {
                        playNotificationSound();
                    }

                    lastNotificationCount = newCount;
                    allNotifications = data.data;
                    filteredNotifications = [...allNotifications];

                    updateStatistics();
                    displayNotifications();
                    updateUnreadBadges();
                } else {
                    if (!silent) showAlert('error', data.message || 'Không thể tải thông báo');
                    handleSessionExpired(data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                if (!silent) showAlert('error', 'Lỗi kết nối server');
                handleSessionExpired("fetch_failed");
            } finally {
                if (!silent) showLoading(false);
            }
        }

        function updateStatistics() {
            const total = allNotifications.length;
            const unread = allNotifications.filter(n => !n.daXem).length;
            const leave = allNotifications.filter(n => n.loai === 'Nghỉ phép').length;
            const passwordReset = allNotifications.filter(n => n.loai === 'Cấp lại mật khẩu').length;

            animateNumber('totalNotifications', total);
            animateNumber('unreadNotifications', unread);
            animateNumber('leaveNotifications', leave);
            animateNumber('passwordResetNotifications', passwordReset);
        }

        function displayNotifications() {
            const container = document.getElementById('notificationsList');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredNotifications.slice(start, end);

            if (pageData.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted">Không có thông báo</div>';
                updatePagination();
                return;
            }

            container.innerHTML = pageData.map(notif => {
                const isUnread = !notif.daXem;

                if (notif.loai === 'Cấp lại mật khẩu') {
                    return renderPasswordResetNotification(notif, isUnread);
                } else {
                    return renderLeaveNotification(notif, isUnread);
                }
            }).join('');

            updatePagination();
        }

        function renderPasswordResetNotification(notif, isUnread) {
            const typeClass = 'password';
            const icon = 'fa-key';
            const isPending = notif.trangThai === 'Chờ';

            return `
                <div class="notification-item ${isUnread ? 'unread' : ''}" onclick="markAsRead(${notif.maThongBao})">
                    <div class="notification-header">
                        <span class="notification-type ${typeClass}">
                            <i class="fas ${icon}"></i>
                            ${notif.loai}
                        </span>
                        <span class="notification-time">${formatTimeAgo(notif.thoiGian)}</span>
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">${notif.tieuDe}</div>
                        <div class="notification-text">${notif.noiDung}</div>
                    </div>
                    <div class="password-request-info">
                        <div class="info-row">
                            <i class="fas fa-user"></i>
                            <strong>Người yêu cầu:</strong> ${notif.tenNguoiGui} <small class="text-muted">(${notif.vaiTro})</small>
                        </div>
                        <div class="info-row">
                            <i class="fas fa-phone"></i>
                            <strong>SĐT:</strong> ${notif.soDienThoai || 'N/A'}
                        </div>
                        <div class="info-row">
                            <i class="fas fa-info-circle"></i>
                            <strong>Trạng thái:</strong> 
                            <span class="status-badge ${notif.trangThai === 'Chờ' ? 'pending' : notif.trangThai === 'Đã xử lý' ? 'processed' : 'rejected'}">
                                ${notif.trangThai === 'Chờ' ? 'Chờ xử lý' : notif.trangThai === 'Đã xử lý' ? 'Đã chấp nhận' : 'Đã từ chối'}
                            </span>
                        </div>
                        ${notif.trangThai !== 'Chờ' && notif.thoiGianXuLy ? `
                        <div class="info-row">
                            <i class="fas fa-clock"></i>
                            <strong>Xử lý lúc:</strong> ${formatDateTime(notif.thoiGianXuLy)}
                        </div>
                        ` : ''}
                    </div>
                    <div class="notification-actions" onclick="event.stopPropagation()">
                        ${isPending ? `
                            <button class="btn-notif-action btn-approve" onclick="processPasswordReset(${notif.maYeuCau}, 'approve', ${notif.maThongBao})">
                                <i class="fas fa-check"></i> Chấp nhận
                            </button>
                            <button class="btn-notif-action btn-reject" onclick="processPasswordReset(${notif.maYeuCau}, 'reject', ${notif.maThongBao})">
                                <i class="fas fa-times"></i> Từ chối
                            </button>
                        ` : ''}
                        <button class="btn-notif-action btn-delete" onclick="deleteNotification(${notif.maThongBao})">
                            <i class="fas fa-trash"></i> Xóa
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLeaveNotification(notif, isUnread) {
            const typeClass = notif.loai === 'Nghỉ phép' ? 'leave' : 'cancel';
            const icon = notif.loai === 'Nghỉ phép' ? 'fa-calendar-plus' : 'fa-calendar-times';

            return `
                <div class="notification-item ${isUnread ? 'unread' : ''}" onclick="markAsRead(${notif.maThongBao})">
                    <div class="notification-header">
                        <span class="notification-type ${typeClass}">
                            <i class="fas ${icon}"></i>
                            ${notif.loai}
                        </span>
                        <span class="notification-time">${formatTimeAgo(notif.thoiGian)}</span>
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">${notif.tieuDe}</div>
                        <div class="notification-text">${notif.noiDung}</div>
                    </div>
                    <div class="notification-details">
                        <div class="notification-detail">
                            <i class="fas fa-user-md"></i>
                            <span>${notif.tenNguoiGui}</span>
                        </div>
                        <div class="notification-detail">
                            <i class="fas fa-calendar"></i>
                            <span>${notif.ngayNghi || 'N/A'}</span>
                        </div>
                        ${notif.tenCa ? `
                        <div class="notification-detail">
                            <i class="fas fa-clock"></i>
                            <span>${notif.tenCa}</span>
                        </div>` : ''}
                    </div>
                    <div class="notification-actions" onclick="event.stopPropagation()">
                        <button class="btn-notif-action btn-delete" onclick="deleteNotification(${notif.maThongBao})">
                            <i class="fas fa-trash"></i> Xóa
                        </button>
                    </div>
                </div>
            `;
        }

        async function processPasswordReset(maYeuCau, action, maThongBao) {
            const actionText = action === 'approve' ? 'chấp nhận' : 'từ chối';
            if (!confirm(`Bạn có chắc muốn ${actionText} yêu cầu này?`)) return;

            try {
                const response = await fetch(`${API_BASE_ADMIN}/process-password-reset.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ requestId: maYeuCau, action })
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('success', data.message);
                    loadNotifications();
                } else {
                    showAlert('error', data.message || `Không thể ${actionText} yêu cầu`);
                }
            } catch (error) {
                showAlert('error', 'Lỗi kết nối server');
            }
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredNotifications.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredNotifications.length);

            document.getElementById('recordInfo').textContent =
                `Hiển thị ${start} - ${end} của ${filteredNotifications.length} thông báo`;

            let html = `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            html += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `;

            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredNotifications.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                displayNotifications();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            const status = document.getElementById('statusFilter').value;

            filteredNotifications = allNotifications.filter(notif => {
                let match = true;

                if (search && !(notif.tieuDe.toLowerCase().includes(search) ||
                    notif.noiDung.toLowerCase().includes(search) ||
                    notif.tenBacSi.toLowerCase().includes(search))) {
                    match = false;
                }

                if (type && notif.loai !== type) match = false;

                if (status === 'unread' && notif.daXem) match = false;
                if (status === 'read' && !notif.daXem) match = false;

                return match;
            });

            currentPage = 1;
            displayNotifications();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('statusFilter').value = '';
            filteredNotifications = [...allNotifications];
            currentPage = 1;
            displayNotifications();
        }

        async function markAsRead(maThongBao) {
            try {
                await fetch(`${API_BASE_ADMIN}/mark-admin-notification-read.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ maThongBao })
                });

                const notification = allNotifications.find(n => n.maThongBao === maThongBao);
                if (notification) {
                    notification.daXem = true;
                    updateStatistics();
                    displayNotifications();
                    updateUnreadBadges();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function markAllAsRead() {
            try {
                const response = await fetch(`${API_BASE_ADMIN}/mark-all-admin-notifications-read.php`, {
                    method: 'POST',
                    credentials: 'include'
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('success', 'Đã đánh dấu tất cả đã đọc!');
                    loadNotifications();
                } else {
                    showAlert('error', data.message || 'Không thể đánh dấu');
                }
            } catch (error) {
                showAlert('error', 'Lỗi kết nối server');
            }
        }

        async function deleteNotification(maThongBao) {
            if (!confirm('Bạn có chắc muốn xóa thông báo này?')) return;

            try {
                const response = await fetch(`${API_BASE_ADMIN}/delete-admin-notification.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ maThongBao })
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('success', 'Đã xóa thông báo!');
                    loadNotifications();
                } else {
                    showAlert('error', data.message || 'Không thể xóa');
                }
            } catch (error) {
                showAlert('error', 'Lỗi kết nối server');
            }
        }

        async function deleteAllRead() {
            if (!confirm('Bạn có chắc muốn xóa tất cả thông báo đã đọc?')) return;

            try {
                const response = await fetch(`${API_BASE_ADMIN}/delete-read-admin-notifications.php`, {
                    method: 'POST',
                    credentials: 'include'
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('success', `Đã xóa ${data.deleted} thông báo!`);
                    loadNotifications();
                } else {
                    showAlert('error', data.message || 'Không thể xóa');
                }
            } catch (error) {
                showAlert('error', 'Lỗi kết nối server');
            }
        }

        function updateUnreadBadges() {
            const unreadCount = allNotifications.filter(n => !n.daXem).length;

            const topBadge = document.getElementById('topNotifBadge');
            const sidebarBadge = document.getElementById('sidebarNotifBadge');

            if (unreadCount > 0) {
                topBadge.textContent = unreadCount;
                topBadge.style.display = 'inline-block';
                sidebarBadge.textContent = unreadCount;
                sidebarBadge.style.display = 'inline-block';
            } else {
                topBadge.style.display = 'none';
                sidebarBadge.style.display = 'none';
            }
        }

        function formatTimeAgo(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 1) return 'Vừa xong';
            if (diffMins < 60) return `${diffMins} phút trước`;
            if (diffHours < 24) return `${diffHours} giờ trước`;
            if (diffDays < 7) return `${diffDays} ngày trước`;

            return date.toLocaleDateString('vi-VN');
        }

        function formatDateTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('vi-VN', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function playNotificationSound() {
            const sound = document.getElementById('notificationSound');
            sound.play().catch(e => console.log('Sound play failed:', e));
        }

        // Override shared logout to also stop auto-refresh
        const _originalLogout = logout;
        logout = async function () {
            stopAutoRefresh();
            await _originalLogout();
        };
    </script>
