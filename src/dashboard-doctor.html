<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bác Sĩ</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-doctor-css" rel="stylesheet" href="assets/css/sidebar-doctor.css">
    <style>
        .summary-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #f8f9fb;
            border: 1px solid #e9ecef;
            color: #4c5665;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .summary-chip i {
            color: var(--primary-blue, #4A90E2);
        }

        .summary-chip strong {
            color: #1f2a37;
            font-size: 1rem;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0 0 20px 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .search-box input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898aa;
        }
        .search-box .search-clear-btn {
            right: 10px;
        }

        .form-select {
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .form-select:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 20px 0;
        }

        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #4A90E2;
            border-radius: 10px;
        }

        .custom-table {
            width: 100%;
            margin: 0;
            border-collapse: collapse;
        }

        .custom-table thead {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
        }

        .custom-table thead th {
            border: none;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .actions-col {
            width: 58px;
            text-align: center;
        }
        .actions-cell {
            text-align: center;
            white-space: nowrap;
        }

        .custom-table tbody tr {
            transition: all 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }

        .custom-table tbody tr:hover {
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .custom-table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .time-badge {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            white-space: nowrap;
        }

        .patient-name {
            font-weight: 600;
            color: #333;
        }

        .patient-age {
            color: #666;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .status-booked {
            background: #fff3cd;
            color: #856404;
        }

        .status-waiting {
            background: #e8f4fd;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .status-missed {
            background: #ffe5d0;
            color: #a15c00;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            margin: 0 3px;
            transition: all 0.3s;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-view {
            background: #3498db;
            color: white;
        }

        .btn-view:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-complete {
            background: #2ecc71;
            color: white;
        }

        .btn-complete:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-blue, #4A90E2);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-blue, #4A90E2);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-blue, #4A90E2);
            border-color: var(--primary-blue, #4A90E2);
        }

        .modal-header {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        @media (max-width: 768px) {
            .summary-chips {
                gap: 8px;
                margin-bottom: 15px;
            }

            .section-card {
                padding: 15px;
            }

            .filter-bar {
                padding: 15px;
            }

            .table-responsive {
                margin: 15px -15px;
                padding: 0 15px;
            }

            .custom-table {
                font-size: 0.85rem;
                min-width: 600px;
            }

            .custom-table thead th,
            .custom-table tbody td {
                padding: 10px 8px;
            }

            .btn-action {
                padding: 5px 8px;
                font-size: 0.8rem;
                margin: 2px;
            }

            .time-badge {
                font-size: 0.75rem;
                padding: 4px 6px;
            }

            .status-badge {
                font-size: 0.75rem;
                padding: 4px 8px;
            }

            .pagination-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="summary-chips">
            <div class="summary-chip"><i class="fas fa-users"></i>Tổng bệnh nhân: <strong id="totalPatients">0</strong></div>
            <div class="summary-chip"><i class="fas fa-calendar-day"></i>Lịch hôm nay: <strong id="todayCount">0</strong></div>
            <div class="summary-chip"><i class="fas fa-check-circle"></i>Đã hoàn thành: <strong id="completedCount">0</strong></div>
            <div class="summary-chip"><i class="fas fa-clock"></i>Chưa hoàn tất: <strong id="pendingCount">0</strong></div>
        </div>

        <div class="section-card">
            <div class="card-header table-header">
                <h5><i class="fas fa-list-ol me-2"></i>Hàng đợi khám hôm nay <span class="badge bg-primary"
                        id="totalToday">0</span></h5>
                <div class="table-header-actions">
                    <button class="sort-toggle-btn" id="sortToggleBtn" type="button" onclick="toggleSortOrder()" aria-label="Đổi thứ tự STT">
                        <i id="sortToggleIcon" class="fas fa-sort-amount-down-alt"></i>
                    </button>
                </div>
            </div>

            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="search-box filter-control-wrap">
                            <i class="fas fa-search"></i>
                            <input type="text" class="form-control" id="searchInput" placeholder="Tìm bệnh nhân..."
                                oninput="applyFilters()">
                            <button type="button" class="filter-clear-btn" id="clearSearchBtn" aria-label="Xóa từ khóa tìm kiếm" onclick="clearSearch()">×</button>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="shiftFilter" onchange="applyFilters()">
                            <option value="">Tất cả ca</option>
                            <option value="1">Ca sáng</option>
                            <option value="2">Ca chiều</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="statusFilter" onchange="applyFilters()">
                            <option value="">Tất cả trạng thái</option>
                            <option value="Đang chờ">Đang chờ</option>
                            <option value="Đang khám">Đang khám</option>
                            <option value="Hoàn thành">Hoàn thành</option>
                            <option value="Bỏ lỡ">Bỏ lỡ</option>
                            <option value="Hủy">Đã hủy</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải...</p>
            </div>

            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Bệnh nhân</th>
                            <th>Giới tính</th>
                            <th>Giờ hẹn gốc</th>
                            <th>Nguồn</th>
                            <th>Trạng thái</th>
                            <th class="actions-col"><i class="fas fa-cog"></i></th>
                        </tr>
                    </thead>
                    <tbody id="patientList"></tbody>
                </table>
            </div>

            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 lịch</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Modal Chi tiết lịch khám -->
    <div class="modal fade" id="viewAppointmentModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-calendar-check me-2"></i>Chi tiết lịch khám</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="appointmentDetails"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/doctor-page-helper.js"></script>
    <script src="assets/js/sidebar-doctor.js"></script>
    <script>
        const API_BASE = window.DoctorPageHelper.doctorApiBase;

        let currentPage = 1;
        const itemsPerPage = 10;
        let currentAppointments = [];
        let totalAppointments = 0;
        let sortOrder = 'asc';
        let autoRefreshTimer = null;

        function getQueueUiStatus(appointment) {
            const map = {
                'Đang chờ': { label: 'Đang chờ', className: 'status-booked' },
                'Đang khám': { label: 'Đang khám', className: 'status-waiting' },
                'Hoàn thành': { label: 'Hoàn thành', className: 'status-completed' },
                'Bỏ lỡ': { label: 'Bỏ lỡ', className: 'status-missed' },
                'Hủy': { label: 'Đã hủy', className: 'status-cancelled' }
            };
            return map[appointment.trangThaiHangDoi] || { label: appointment.trangThaiHangDoi, className: 'status-booked' };
        }

        function getQueueActions(appointment) {
            const trangThai = appointment.trangThaiHangDoi;
            const actions = [
                { label: 'Xem chi tiết', icon: 'fa-eye', onClick: `viewAppointment(${appointment.maLichKham})`, variant: 'view' }
            ];

            if (trangThai === 'Đang chờ') {
                actions.push({ label: 'Gọi khám', icon: 'fa-bullhorn', onClick: `callPatient(${appointment.maHangDoi})`, variant: 'complete' });
                actions.push({ label: 'Bỏ lỡ', icon: 'fa-user-clock', onClick: `markMissed(${appointment.maHangDoi})`, variant: 'cancel' });
                actions.push({ label: 'Hủy lịch', icon: 'fa-times', onClick: `cancelFromQueue(${appointment.maLichKham})`, variant: 'cancel' });
            } else if (trangThai === 'Đang khám') {
                const recordUrl = !appointment.maHoSo
                    ? `ho-so-benh-an.html?createFor=${encodeURIComponent(String(appointment.maLichKham))}`
                    : (appointment.trangThaiHoSo === 'Chưa hoàn thành'
                        ? `ho-so-benh-an.html?edit=${encodeURIComponent(String(appointment.maHoSo))}`
                        : null);
                if (recordUrl) {
                    actions.push({
                        label: appointment.maHoSo ? 'Hoàn tất hồ sơ' : 'Khởi tạo hồ sơ',
                        icon: appointment.maHoSo ? 'fa-edit' : 'fa-notes-medical',
                        onClick: `openRecordWorkflow('${recordUrl}')`,
                        variant: 'complete'
                    });
                }
                actions.push({ label: 'Bỏ lỡ', icon: 'fa-user-clock', onClick: `markMissed(${appointment.maHangDoi})`, variant: 'cancel' });
                actions.push({ label: 'Hủy lịch', icon: 'fa-times', onClick: `cancelFromQueue(${appointment.maLichKham})`, variant: 'cancel' });
            } else if (trangThai === 'Bỏ lỡ') {
                actions.push({ label: 'Gọi lại', icon: 'fa-redo', onClick: `recallPatient(${appointment.maHangDoi})`, variant: 'complete' });
                actions.push({ label: 'Hủy lịch', icon: 'fa-times', onClick: `cancelFromQueue(${appointment.maLichKham})`, variant: 'cancel' });
            } else if (trangThai === 'Hoàn thành' && appointment.maHoSo) {
                actions.push({
                    label: 'Xem hồ sơ',
                    icon: 'fa-file-medical-alt',
                    onClick: `openRecordWorkflow('ho-so-benh-an.html?view=${encodeURIComponent(String(appointment.maHoSo))}')`,
                    variant: 'view'
                });
            }

            return actions;
        }

        function openRecordWorkflow(url) {
            window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', function () {
            window.DoctorPageHelper.syncSearchClearButton('searchInput', 'clearSearchBtn');
            syncSortToggle();
            loadStatistics();
            loadQueue(1);
            startAutoRefresh();
        });

        function startAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => {
                loadQueue(currentPage, { silent: true });
            }, 30000);
        }

        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE}/get-statistics.php`, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    animateNumber('totalPatients', data.data.totalPatients);
                    animateNumber('todayCount', data.data.todayCount);
                    animateNumber('completedCount', data.data.completedCount);
                    animateNumber('pendingCount', data.data.pendingCount);
                } else {
                    handleSessionExpired(data.message);
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
                handleSessionExpired("fetch_failed");
            }
        }

        function buildQueueQuery(page = 1) {
            const params = new URLSearchParams();
            params.set('page', String(page));
            params.set('limit', String(itemsPerPage));

            const search = document.getElementById('searchInput')?.value?.trim() || '';
            const shift = document.getElementById('shiftFilter')?.value || '';
            const status = document.getElementById('statusFilter')?.value || '';
            params.set('order', sortOrder);

            if (search) params.set('search', search);
            if (shift) params.set('shift', shift);
            if (status) params.set('status', status);

            return params.toString();
        }

        async function loadQueue(page = 1, options = {}) {
            const silent = Boolean(options.silent);
            if (!silent) showLoading(true);

            try {
                const response = await fetch(`${API_BASE}/get-queue.php?${buildQueueQuery(page)}`, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    currentAppointments = data.data || [];
                    totalAppointments = Number(data.pagination?.total || 0);
                    currentPage = Number(data.pagination?.page || page || 1);
                    displayAppointments();
                } else if (!silent) {
                    showError(data.message || 'Không thể tải dữ liệu');
                    handleSessionExpired(data.message);
                }
            } catch (error) {
                console.error('Error loading queue:', error);
                if (!silent) {
                    showError('Lỗi kết nối server');
                    handleSessionExpired("fetch_failed");
                }
            } finally {
                if (!silent) showLoading(false);
            }
        }

        function displayAppointments() {
            const container = document.getElementById('patientList');

            document.getElementById('totalToday').textContent = totalAppointments;

            if (currentAppointments.length === 0) {
                container.innerHTML = '<tr><td colspan="7" class="text-center py-5">Chưa có bệnh nhân nào trong hàng đợi</td></tr>';
                updatePagination();
                return;
            }

            container.innerHTML = currentAppointments.map(apt => {
                const status = getQueueUiStatus(apt);
                const actions = getQueueActions(apt);

                return `
                    <tr>
                        <td><strong>${apt.soThuTu}</strong></td>
                        <td>
                            <div class="patient-name">${apt.tenBenhNhan}</div>
                            <div class="patient-age">${calculateAge(apt.ngaySinh)} tuổi</div>
                        </td>
                        <td>${apt.gioiTinh}</td>
                        <td>${apt.tenCa} ${apt.gioBatDau ? apt.gioBatDau.substring(0, 5) : ''}</td>
                        <td>${apt.nguon === 'truc_tiep' ? 'Trực tiếp' : 'Online'}</td>
                        <td><span class="status-badge ${status.className}">${status.label}</span></td>
                        <td class="actions-cell">${window.DoctorPageHelper.renderTableActions(actions)}</td>
                    </tr>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = totalAppointments > 0 ? Math.ceil(totalAppointments / itemsPerPage) : 0;
            const container = document.getElementById('paginationContainer');
            if (totalAppointments === 0) {
                document.getElementById('recordInfo').textContent = 'Hiển thị 0 - 0 của 0 lịch';
                container.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, totalAppointments);

            document.getElementById('recordInfo').textContent =
                `Hiển thị ${start} - ${end} của ${totalAppointments} lịch`;

            let html = `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            html += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `;

            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = totalAppointments > 0 ? Math.ceil(totalAppointments / itemsPerPage) : 0;
            if (page >= 1 && page <= totalPages) {
                loadQueue(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function applyFilters() {
            currentPage = 1;
            window.DoctorPageHelper.syncSearchClearButton('searchInput', 'clearSearchBtn');
            loadQueue(1);
        }

        function clearSearch() {
            window.DoctorPageHelper.clearSearchInput('searchInput', 'clearSearchBtn', 'applyFilters');
        }

        function toggleSortOrder() {
            sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
            syncSortToggle();
            loadQueue(currentPage);
        }

        function syncSortToggle() {
            const btn = document.getElementById('sortToggleBtn');
            const icon = document.getElementById('sortToggleIcon');
            if (!btn || !icon) return;
            const isAsc = sortOrder === 'asc';
            icon.className = `fas ${isAsc ? 'fa-sort-amount-down-alt' : 'fa-sort-amount-up-alt'}`;
            btn.title = isAsc ? 'Đang sắp xếp: STT nhỏ trước' : 'Đang sắp xếp: STT lớn trước';
        }

        async function callPatient(maHangDoi) {
            await runQueueAction(maHangDoi, 'goikham');
        }

        async function markMissed(maHangDoi) {
            await runQueueAction(maHangDoi, 'bolo');
        }

        async function recallPatient(maHangDoi) {
            await runQueueAction(maHangDoi, 'goilai');
        }

        async function runQueueAction(maHangDoi, action) {
            try {
                const response = await fetch(`${API_BASE}/update-queue-status.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ maHangDoi, action })
                });
                const data = await response.json();
                if (data.success) {
                    loadQueue(currentPage);
                } else {
                    showAlert('error', data.message || 'Không thể cập nhật trạng thái');
                }
            } catch (error) {
                console.error('Error updating queue status:', error);
                showAlert('error', 'Lỗi kết nối server');
            }
        }

        async function cancelFromQueue(maLichKham) {
            const lyDo = prompt('Lý do hủy lịch (không bắt buộc):', '') || '';
            if (!confirm('Xác nhận hủy lịch khám này?')) return;

            try {
                const response = await fetch(`${API_BASE}/cancel-appointment.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ maLichKham, lyDo: lyDo.trim(), fromQueue: true })
                });
                const data = await response.json();
                if (data.success) {
                    showAlert('success', 'Đã hủy lịch khám!');
                    loadQueue(currentPage);
                } else {
                    showAlert('error', data.message || 'Không thể hủy');
                }
            } catch (error) {
                console.error('Error cancelling from queue:', error);
                showAlert('error', 'Lỗi kết nối server');
            }
        }

        async function viewAppointment(maLichKham) {
            const apt = currentAppointments.find(a => String(a.maLichKham) === String(maLichKham));
            if (!apt) return;

            const age = calculateAge(apt.ngaySinh);
            const details = document.getElementById('appointmentDetails');
            const status = getQueueUiStatus(apt);
            const recordStatusText = !apt.maHoSo
                ? 'Chưa tạo hồ sơ'
                : apt.trangThaiHoSo === 'Đã hoàn thành'
                    ? 'Đã hoàn thành hồ sơ'
                    : 'Đang soạn hồ sơ';

            details.innerHTML = `
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-hashtag me-2"></i>Số thứ tự:</strong>
                        <p>${apt.soThuTu}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-user me-2"></i>Bệnh nhân:</strong>
                        <p>${apt.tenBenhNhan}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-birthday-cake me-2"></i>Tuổi:</strong>
                        <p>${age} tuổi (${new Date(apt.ngaySinh).toLocaleDateString('vi-VN')})</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-venus-mars me-2"></i>Giới tính:</strong>
                        <p>${apt.gioiTinh}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-calendar me-2"></i>Ca hẹn gốc:</strong>
                        <p>${apt.tenCa} (${apt.gioBatDau} - ${apt.gioKetThuc})</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-door-open me-2"></i>Nguồn:</strong>
                        <p>${apt.nguon === 'truc_tiep' ? 'Đến khám trực tiếp' : 'Đặt lịch online'}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-box-open me-2"></i>Gói khám:</strong>
                        <p>${apt.tenGoi || 'Không chọn gói'}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-info-circle me-2"></i>Trạng thái hàng đợi:</strong>
                        <p><span class="status-badge ${status.className}">${status.label}</span></p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-file-medical me-2"></i>Hồ sơ bệnh án:</strong>
                        <p>${recordStatusText}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-door-open me-2"></i>Giờ check-in:</strong>
                        <p>${apt.thoiGianCheckIn ? new Date(apt.thoiGianCheckIn).toLocaleTimeString('vi-VN') : '—'}</p>
                    </div>
                    ${apt.ghiChu ? `
                    <div class="col-md-12 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-sticky-note me-2"></i>Ghi chú:</strong>
                        <p>${apt.ghiChu}</p>
                    </div>` : ''}
                </div>
            `;

            new bootstrap.Modal(document.getElementById('viewAppointmentModal')).show();
        }

        function calculateAge(birthDate) {
            const birth = new Date(birthDate);
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function animateNumber(elementId, targetNumber) {
            const element = document.getElementById(elementId);
            let currentNumber = 0;
            const increment = targetNumber / 50;
            const duration = 1000;
            const stepTime = duration / 50;

            const timer = setInterval(() => {
                currentNumber += increment;
                if (currentNumber >= targetNumber) {
                    element.textContent = targetNumber;
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(currentNumber);
                }
            }, stepTime);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
            document.querySelector('.table-responsive').style.display = show ? 'none' : 'block';
        }

        function showError(message) {
            document.getElementById('patientList').innerHTML = `
                <tr><td colspan="7" class="text-center py-5 text-danger">${message}</td></tr>
            `;
        }
    </script>
</body>

</html>
