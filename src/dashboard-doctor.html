<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bác Sĩ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-doctor-css" rel="stylesheet" href="assets/css/sidebar-doctor.css">
    <style>
        .summary-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #f8f9fb;
            border: 1px solid #e9ecef;
            color: #4c5665;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .summary-chip i {
            color: var(--primary-blue, #4A90E2);
        }

        .summary-chip strong {
            color: #1f2a37;
            font-size: 1rem;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0 0 20px 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .search-box input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898aa;
        }

        .form-select {
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .form-select:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 20px 0;
        }

        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #4A90E2;
            border-radius: 10px;
        }

        .custom-table {
            width: 100%;
            margin: 0;
            border-collapse: collapse;
        }

        .custom-table thead {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
        }

        .custom-table thead th {
            border: none;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .custom-table tbody tr {
            transition: all 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }

        .custom-table tbody tr:hover {
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .custom-table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .time-badge {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            white-space: nowrap;
        }

        .patient-name {
            font-weight: 600;
            color: #333;
        }

        .patient-age {
            color: #666;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .status-booked {
            background: #fff3cd;
            color: #856404;
        }

        .status-waiting {
            background: #e8f4fd;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            margin: 0 3px;
            transition: all 0.3s;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-view {
            background: #3498db;
            color: white;
        }

        .btn-view:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-complete {
            background: #2ecc71;
            color: white;
        }

        .btn-complete:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-blue, #4A90E2);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-blue, #4A90E2);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-blue, #4A90E2);
            border-color: var(--primary-blue, #4A90E2);
        }

        .modal-header {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        @media (max-width: 768px) {
            .summary-chips {
                gap: 8px;
                margin-bottom: 15px;
            }

            .section-card {
                padding: 15px;
            }

            .filter-bar {
                padding: 15px;
            }

            .table-responsive {
                margin: 15px -15px;
                padding: 0 15px;
            }

            .custom-table {
                font-size: 0.85rem;
                min-width: 600px;
            }

            .custom-table thead th,
            .custom-table tbody td {
                padding: 10px 8px;
            }

            .btn-action {
                padding: 5px 8px;
                font-size: 0.8rem;
                margin: 2px;
            }

            .time-badge {
                font-size: 0.75rem;
                padding: 4px 6px;
            }

            .status-badge {
                font-size: 0.75rem;
                padding: 4px 8px;
            }

            .pagination-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="summary-chips">
            <div class="summary-chip"><i class="fas fa-users"></i>Tổng bệnh nhân: <strong id="totalPatients">0</strong></div>
            <div class="summary-chip"><i class="fas fa-calendar-day"></i>Lịch hôm nay: <strong id="todayCount">0</strong></div>
            <div class="summary-chip"><i class="fas fa-check-circle"></i>Đã hoàn thành: <strong id="completedCount">0</strong></div>
            <div class="summary-chip"><i class="fas fa-clock"></i>Chưa hoàn tất: <strong id="pendingCount">0</strong></div>
        </div>

        <div class="section-card">
            <div class="card-header">
                <h5><i class="fas fa-calendar-alt me-2"></i>Lịch khám hôm nay <span class="badge bg-primary"
                        id="totalToday">0</span></h5>
            </div>

            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" class="form-control" id="searchInput" placeholder="Tìm bệnh nhân..."
                                oninput="applyFilters()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="shiftFilter" onchange="applyFilters()">
                            <option value="">Tất cả ca</option>
                            <option value="1">Ca sáng</option>
                            <option value="2">Ca chiều</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="statusFilter" onchange="applyFilters()">
                            <option value="">Tất cả trạng thái</option>
                            <option value="booked">Chờ khám</option>
                            <option value="draft">Chờ hoàn tất hồ sơ</option>
                            <option value="completed">Đã khám</option>
                            <option value="cancelled">Đã hủy</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" onclick="resetFilters()">
                            <i class="fas fa-redo me-1"></i>Đặt lại
                        </button>
                    </div>
                </div>
            </div>

            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải...</p>
            </div>

            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Giờ</th>
                            <th>Bệnh nhân</th>
                            <th>Giới tính</th>
                            <th>Gói khám</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="patientList"></tbody>
                </table>
            </div>

            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 lịch</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Modal Chi tiết lịch khám -->
    <div class="modal fade" id="viewAppointmentModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-calendar-check me-2"></i>Chi tiết lịch khám</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="appointmentDetails"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/sidebar-doctor.js"></script>    
    <script>
        const COMPONENT_PATH = 'components/';
        const API_BASE_DOCTOR = window.API_ENDPOINTS.doctor;
        const API_BASE_AUTH = window.API_ENDPOINTS.auth;
        var DOCTOR_INFO = {};
    </script>
    <script>
        const API_BASE = window.API_ENDPOINTS.doctor;

        let currentPage = 1;
        const itemsPerPage = 10;
        let allAppointments = [];
        let filteredAppointments = [];

        function getAppointmentUiStatus(appointment) {
            if (appointment.trangThai === 'Hủy') {
                return { value: 'cancelled', label: 'Đã hủy', className: 'status-cancelled' };
            }

            if (appointment.maHoSo && appointment.trangThaiHoSo === 'Chưa hoàn thành') {
                return { value: 'draft', label: 'Chờ hoàn tất hồ sơ', className: 'status-waiting' };
            }

            if (appointment.trangThai === 'Hoàn thành' || appointment.trangThaiHoSo === 'Đã hoàn thành') {
                return { value: 'completed', label: 'Đã khám', className: 'status-completed' };
            }

            return { value: 'booked', label: 'Chờ khám', className: 'status-booked' };
        }

        function getRecordAction(appointment) {
            if (appointment.trangThai === 'Hủy') {
                return null;
            }

            if (!appointment.maHoSo) {
                return {
                    title: 'Khởi tạo hồ sơ',
                    icon: 'fa-file-circle-plus',
                    url: `ho-so-benh-an.html?createFor=${encodeURIComponent(String(appointment.maLichKham))}`
                };
            }

            if (appointment.trangThaiHoSo === 'Chưa hoàn thành') {
                return {
                    title: 'Hoàn tất hồ sơ',
                    icon: 'fa-pen-to-square',
                    url: `ho-so-benh-an.html?edit=${encodeURIComponent(String(appointment.maHoSo))}`
                };
            }

            return null;
        }

        function openRecordWorkflow(url) {
            window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadStatistics();
            loadTodayAppointments();
        });

        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE}/get-statistics.php`, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    animateNumber('totalPatients', data.data.totalPatients);
                    animateNumber('todayCount', data.data.todayCount);
                    animateNumber('completedCount', data.data.completedCount);
                    animateNumber('pendingCount', data.data.pendingCount);
                } else {
                    handleSessionExpired(data.message);
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
                handleSessionExpired("fetch_failed");
            }
        }

        async function loadTodayAppointments() {
            showLoading(true);

            try {
                const response = await fetch(`${API_BASE}/get-today-appointments.php`, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    allAppointments = data.data;
                    filteredAppointments = [...allAppointments];
                    displayAppointments();
                } else {
                    showError(data.message || 'Không thể tải dữ liệu');
                    handleSessionExpired(data.message);
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
                showError('Lỗi kết nối server');
                handleSessionExpired("fetch_failed");
            } finally {
                showLoading(false);
            }
        }

        function displayAppointments() {
            const container = document.getElementById('patientList');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredAppointments.slice(start, end);

            document.getElementById('totalToday').textContent = filteredAppointments.length;

            if (pageData.length === 0) {
                container.innerHTML = '<tr><td colspan="6" class="text-center py-5">Không có lịch khám</td></tr>';
                updatePagination();
                return;
            }

            container.innerHTML = pageData.map(apt => {
                const age = calculateAge(apt.ngaySinh);
                const status = getAppointmentUiStatus(apt);
                const recordAction = getRecordAction(apt);

                return `
                    <tr>
                        <td><span class="time-badge">${apt.tenCa}<br>${apt.gioBatDau.substring(0, 5)}</span></td>
                        <td>
                            <div class="patient-name">${apt.tenBenhNhan}</div>
                            <div class="patient-age">${age} tuổi</div>
                        </td>
                        <td>${apt.gioiTinh}</td>
                        <td>${apt.tenGoi}</td>
                        <td><span class="status-badge ${status.className}">${status.label}</span></td>
                        <td>
                            <button class="btn-action btn-view" onclick="viewAppointment(${apt.maLichKham})" title="Xem chi tiết">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${recordAction ? `
                            <button class="btn-action btn-complete" onclick="openRecordWorkflow('${recordAction.url}')" title="${recordAction.title}">
                                <i class="fas ${recordAction.icon}"></i>
                            </button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredAppointments.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredAppointments.length);

            document.getElementById('recordInfo').textContent =
                `Hiển thị ${start} - ${end} của ${filteredAppointments.length} lịch`;

            let html = `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            html += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `;

            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredAppointments.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                displayAppointments();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const shift = document.getElementById('shiftFilter').value;
            const status = document.getElementById('statusFilter').value;

            filteredAppointments = allAppointments.filter(apt => {
                let match = true;

                if (search && !apt.tenBenhNhan.toLowerCase().includes(search)) match = false;
                if (shift && apt.maCa != shift) match = false;
                if (status && getAppointmentUiStatus(apt).value !== status) match = false;

                return match;
            });

            currentPage = 1;
            displayAppointments();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('shiftFilter').value = '';
            document.getElementById('statusFilter').value = '';
            filteredAppointments = [...allAppointments];
            currentPage = 1;
            displayAppointments();
        }

        async function viewAppointment(maLichKham) {
            const apt = allAppointments.find(a => a.maLichKham === maLichKham);
            if (!apt) return;

            const age = calculateAge(apt.ngaySinh);
            const details = document.getElementById('appointmentDetails');
            const status = getAppointmentUiStatus(apt);
            const recordStatusText = !apt.maHoSo
                ? 'Chưa tạo hồ sơ'
                : apt.trangThaiHoSo === 'Đã hoàn thành'
                    ? 'Đã hoàn thành hồ sơ'
                    : 'Đang soạn hồ sơ';

            details.innerHTML = `
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-user me-2"></i>Bệnh nhân:</strong>
                        <p>${apt.tenBenhNhan}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-birthday-cake me-2"></i>Tuổi:</strong>
                        <p>${age} tuổi (${new Date(apt.ngaySinh).toLocaleDateString('vi-VN')})</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-venus-mars me-2"></i>Giới tính:</strong>
                        <p>${apt.gioiTinh}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-calendar me-2"></i>Ca khám:</strong>
                        <p>${apt.tenCa}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-clock me-2"></i>Giờ khám:</strong>
                        <p>${apt.gioBatDau} - ${apt.gioKetThuc}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-box-open me-2"></i>Gói khám:</strong>
                        <p>${apt.tenGoi}</p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-info-circle me-2"></i>Trạng thái lịch:</strong>
                        <p><span class="status-badge ${status.className}">${status.label}</span></p>
                    </div>
                    <div class="col-md-6 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-file-medical me-2"></i>Hồ sơ bệnh án:</strong>
                        <p>${recordStatusText}</p>
                    </div>
                    ${apt.ghiChu ? `
                    <div class="col-md-12 mb-3">
                        <strong style="color:#4A90E2"><i class="fas fa-sticky-note me-2"></i>Ghi chú:</strong>
                        <p>${apt.ghiChu}</p>
                    </div>` : ''}
                </div>
            `;

            new bootstrap.Modal(document.getElementById('viewAppointmentModal')).show();
        }

        function calculateAge(birthDate) {
            const birth = new Date(birthDate);
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function animateNumber(elementId, targetNumber) {
            const element = document.getElementById(elementId);
            let currentNumber = 0;
            const increment = targetNumber / 50;
            const duration = 1000;
            const stepTime = duration / 50;

            const timer = setInterval(() => {
                currentNumber += increment;
                if (currentNumber >= targetNumber) {
                    element.textContent = targetNumber;
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(currentNumber);
                }
            }, stepTime);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
            document.querySelector('.table-responsive').style.display = show ? 'none' : 'block';
        }

        function showError(message) {
            document.getElementById('patientList').innerHTML = `
                <tr><td colspan="6" class="text-center py-5 text-danger">${message}</td></tr>
            `;
        }
    </script>
</body>

</html>
