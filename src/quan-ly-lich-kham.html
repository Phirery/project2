<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lịch Khám</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-admin-css" rel="stylesheet" href="assets/css/sidebar-admin.css">
    <link rel="stylesheet" href="assets/css/admin-summary.css">
    <style>
        .summary-chip.total { background: rgba(102, 126, 234, 0.12); border-color: rgba(102, 126, 234, 0.3); }
        .summary-chip.confirmed { background: rgba(0, 174, 239, 0.11); border-color: rgba(0, 174, 239, 0.25); }
        .summary-chip.completed { background: rgba(76, 175, 80, 0.12); border-color: rgba(76, 175, 80, 0.3); }
        .summary-chip.cancelled { background: rgba(255, 152, 0, 0.12); border-color: rgba(255, 152, 0, 0.25); }

        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .filter-section h5 {
            color: var(--primary-purple);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .table-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0px;
        }

        .custom-table thead th {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            color: #495057;
            font-weight: 600;
            padding: 15px;
            border: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-table tbody tr {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .custom-table tbody tr:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .custom-table tbody td {
            padding: 15px;
            border: none;
            vertical-align: middle;
        }

        .custom-table tbody tr td:first-child {
            border-radius: 8px 0 0 8px;
        }

        .custom-table tbody tr td:last-child {
            border-radius: 0 8px 8px 0;
        }

        .custom-table th:nth-child(1) { width: 15%; }
        .custom-table th:nth-child(2) { width: 15%; }
        .custom-table th:nth-child(3) { width: 9%; }
        .custom-table th:nth-child(4) { width: 5%; }
        .custom-table th:nth-child(5) { width: 10%; }
        .custom-table th:nth-child(6) { width: 10%; }
        .custom-table th:nth-child(7) { width: 5%; }
        .custom-table th:nth-child(8) { width: 15%; }

        .badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .badge.confirmed {
            background: #cfe2ff;
            color: #084298;
        }

        .badge.completed {
            background: #d4edda;
            color: #155724;
        }

        .badge.cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 3px;
            transition: all 0.3s;
        }

        .btn-view {
            background: #e3f2fd;
            color: #1976d2;
        }

        .btn-view:hover {
            background: #1976d2;
            color: white;
        }

        .btn-edit {
            background: #fff3cd;
            color: #856404;
        }

        .btn-edit:hover {
            background: #ffc107;
            color: white;
        }

        .btn-delete {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-delete:hover {
            background: #dc3545;
            color: white;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 20px 25px;
        }

        .modal-title {
            font-weight: 700;
        }

        .modal-body {
            padding: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 15px;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 0.3rem;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-purple);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-purple);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-purple);
            border-color: var(--primary-purple);
        }

    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <!-- Summary -->
        <div class="summary-bar" aria-label="Tổng quan lịch khám">
            <div class="summary-chip total is-clickable" onclick="quickFilterAppointments('')">
                <i class="fas fa-calendar-check"></i>
                <span class="summary-label">Tổng lịch khám</span>
                <span class="summary-value" id="totalAppointments">0</span>
            </div>
            <div class="summary-chip confirmed is-clickable" onclick="quickFilterAppointments('Đã đặt')">
                <i class="fas fa-check-circle"></i>
                <span class="summary-label">Đã đặt</span>
                <span class="summary-value" id="confirmedCount">0</span>
            </div>
            <div class="summary-chip completed is-clickable" onclick="quickFilterAppointments('Hoàn thành')">
                <i class="fas fa-check-double"></i>
                <span class="summary-label">Hoàn thành</span>
                <span class="summary-value" id="completedCount">0</span>
            </div>
            <div class="summary-chip cancelled is-clickable" onclick="quickFilterAppointments('Hủy')">
                <i class="fas fa-times-circle"></i>
                <span class="summary-label">Đã hủy</span>
                <span class="summary-value" id="cancelledCount">0</span>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <h5><i class="fas fa-filter me-2"></i>Bộ lọc</h5>
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Tìm kiếm</label>
                    <div class="filter-control-wrap">
                        <input type="text" class="form-control" id="filterSearch" placeholder="Tên bệnh nhân, bác sĩ...">
                        <button type="button" class="filter-clear-btn" aria-label="Xóa tìm lịch khám">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Trạng thái</label>
                            <div class="filter-control-wrap is-select">
                                <select class="form-select" id="filterStatus">
                                    <option value="">Tất cả</option>
                                    <option value="Đã đặt">Đã đặt</option>
                                    <option value="Hoàn thành">Hoàn thành</option>
                                    <option value="Hủy">Đã hủy</option>
                                </select>
                                <button type="button" class="filter-clear-btn" aria-label="Xóa lọc trạng thái">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Từ ngày</label>
                            <div class="filter-control-wrap is-date">
                                <input type="date" class="form-control" id="filterDateFrom">
                                <button type="button" class="filter-clear-btn" aria-label="Xóa ngày bắt đầu">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Đến ngày</label>
                            <div class="filter-control-wrap is-date">
                                <input type="date" class="form-control" id="filterDateTo">
                                <button type="button" class="filter-clear-btn" aria-label="Xóa ngày kết thúc">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-section">
            <div class="table-header">
                <h5><i class="fas fa-list me-2"></i>Danh sách lịch khám</h5>
                <button class="btn-add" onclick="openAddModal()">
                    <i class="fas fa-plus me-2"></i>Thêm lịch khám
                </button>
            </div>

            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải dữ liệu...</p>
            </div>

            <div class="table-responsive" id="tableContainer">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Bệnh nhân</th>
                            <th>Bác sĩ</th>
                            <th>Ngày khám</th>
                            <th>Ca khám</th>
                            <th>Suất khám</th>
                            <th>Gói khám</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentTableBody"></tbody>
                </table>
            </div>

            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 bản ghi</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="appointmentModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm lịch khám</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="appointmentForm">
                        <input type="hidden" id="appointmentId">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Bệnh nhân <span class="text-danger">*</span></label>
                                <select class="form-select" id="patientSelect" required>
                                    <option value="">-- Chọn bệnh nhân --</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Bác sĩ <span class="text-danger">*</span></label>
                                <select class="form-select" id="doctorSelect" required>
                                    <option value="">-- Chọn bác sĩ --</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Ngày khám <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="appointmentDate" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Ca khám <span class="text-danger">*</span></label>
                                <select class="form-select" id="shiftSelect" required onchange="loadTimeSlots()">
                                    <option value="">-- Chọn ca --</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Suất khám <span class="text-danger">*</span></label>
                                <select class="form-select" id="slotSelect" required>
                                    <option value="">-- Chọn suất --</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Gói khám</label>
                                <select class="form-select" id="packageSelect">
                                    <option value="">-- Chọn gói --</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" id="appointmentStatus">
                                    <option value="Đã đặt">Đã đặt</option>
                                    <option value="Hoàn thành">Hoàn thành</option>
                                    <option value="Hủy">Hủy</option>
                                </select>
                                <div class="form-text" id="statusHelpText"></div>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Ghi chú</label>
                                <textarea class="form-control" id="appointmentNote" rows="3" placeholder="Ghi chú thêm (nếu có)"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn-submit mt-4">
                            <i class="fas fa-save me-2"></i>Lưu lịch khám
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- View Detail Modal -->
    <div class="modal fade" id="viewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Chi tiết lịch khám</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/config-admin.js"></script>
    <script src="assets/js/sidebar-admin.js"></script>
    <script src="assets/js/admin-summary.js"></script>
    <script>
let currentPage = 1;
        const itemsPerPage = 10;
        let allAppointments = [];
        let filteredAppointments = [];
        let allShifts = [];
        let allSlots = [];
        let allPackages = [];
        let currentEditingOriginalStatus = null;
        let appointmentSearchFilterTimer;

        const STATUS_TRANSITIONS = {
            'Chờ': ['Chờ', 'Đã đặt', 'Hủy'],
            'Đã đặt': ['Đã đặt', 'Hoàn thành', 'Hủy'],
            'Hoàn thành': ['Hoàn thành'],
            'Hủy': ['Hủy']
        };

        document.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            loadAppointments();
            loadPatients();
            loadDoctors();
            loadShifts();
            loadPackages();
            syncAppointmentSummaryFilter();
            document.getElementById('appointmentDate').min = new Date().toISOString().split('T')[0];
            document.getElementById('appointmentForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('filterStatus').addEventListener('change', applyFilters);
            document.getElementById('filterDateFrom').addEventListener('change', applyFilters);
            document.getElementById('filterDateTo').addEventListener('change', applyFilters);
            document.getElementById('filterSearch').addEventListener('input', triggerRealtimeAppointmentFilter);
        });

        async function loadAppointments() {
            showLoading(true);

            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-all-appointments.php`, {
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.success) {
                    // Lọc bỏ các lịch khám có trạng thái "Chờ"
                    allAppointments = data.data.filter(apt => apt.trangThai !== 'Chờ');
                    filteredAppointments = [...allAppointments];
                    displayAppointments();
                } else {
                    showAlert('error', data.message || 'Không thể tải dữ liệu');
                    handleSessionExpired(data.message || null);
                }
            } catch (error) {
                console.error("loadAppointments fetch error:", error);
                handleSessionExpired("fetch_failed");
            } finally {
                showLoading(false);
            }
        }

        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE_ADMIN}/appointment-stats.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                animateNumber('totalAppointments', data.total || 0);
                animateNumber('confirmedCount', data.confirmed || 0);
                animateNumber('completedCount', data.completed || 0);
                animateNumber('cancelledCount', data.cancelled || 0);
            } catch (error) {
                console.error('Lỗi:', error);
                document.querySelectorAll('#totalAppointments, #confirmedCount, #completedCount, #cancelledCount')
                    .forEach(el => el.textContent = 'Lỗi');
            }
        }

        function displayAppointments() {
            const tbody = document.getElementById('appointmentTableBody');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredAppointments.slice(start, end);
            
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5">Không có dữ liệu</td></tr>';
                return;
            }
            
            tbody.innerHTML = pageData.map(apt => `
                <tr>
                    <td>
                        <i class="fas fa-user-injured me-2 text-primary"></i>
                        ${apt.tenBenhNhan || 'N/A'}
                    </td>
                    <td>
                        <i class="fas fa-user-md me-2 text-success"></i>
                        ${apt.tenBacSi || 'N/A'}
                    </td>
                    <td>${formatDate(apt.ngayKham)}</td>
                    <td>${apt.tenCa || 'N/A'}</td>
                    <td>${apt.gioSuat || 'N/A'}</td>
                    <td>${apt.tenGoi || 'N/A'}</td>
                    <td>${getStatusBadge(apt.trangThai)}</td>
                    <td>
                        <button class="btn-action btn-view" onclick="viewAppointment('${apt.maLichKham}')" title="Xem chi tiết">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn-action btn-edit" onclick="editAppointment('${apt.maLichKham}')" title="Chỉnh sửa">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteAppointment('${apt.maLichKham}')" title="Xóa">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            
            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredAppointments.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredAppointments.length);
            
            document.getElementById('recordInfo').textContent = 
                `Hiển thị ${start} - ${end} của ${filteredAppointments.length} bản ghi`;
            
            let html = `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            html += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `;
            
            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredAppointments.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                displayAppointments();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function applyFilters() {
            const status = document.getElementById('filterStatus').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            
            filteredAppointments = allAppointments.filter(apt => {
                let match = true;
                
                if (status && apt.trangThai !== status) match = false;
                if (dateFrom && apt.ngayKham < dateFrom) match = false;
                if (dateTo && apt.ngayKham > dateTo) match = false;
                if (search) {
                    const searchFields = `${apt.tenBenhNhan} ${apt.tenBacSi}`.toLowerCase();
                    if (!searchFields.includes(search)) match = false;
                }
                
                return match;
            });
            
            currentPage = 1;
            displayAppointments();
            syncAppointmentSummaryFilter();
            window.AdminSummary?.refreshClearableFilters?.();
        }

        function resetFilters() {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.getElementById('filterSearch').value = '';
            filteredAppointments = [...allAppointments];
            currentPage = 1;
            displayAppointments();
            syncAppointmentSummaryFilter();
        }

        function quickFilterAppointments(status) {
            document.getElementById('filterStatus').value = status;
            applyFilters();
        }

        function triggerRealtimeAppointmentFilter() {
            clearTimeout(appointmentSearchFilterTimer);
            appointmentSearchFilterTimer = setTimeout(() => applyFilters(), 180);
        }

        function syncAppointmentSummaryFilter() {
            const status = document.getElementById('filterStatus').value;
            if (window.AdminSummary) {
                window.AdminSummary.setActive('.summary-chip.total', !status);
                window.AdminSummary.setActive('.summary-chip.confirmed', status === 'Đã đặt');
                window.AdminSummary.setActive('.summary-chip.completed', status === 'Hoàn thành');
                window.AdminSummary.setActive('.summary-chip.cancelled', status === 'Hủy');
                return;
            }
            document.querySelector('.summary-chip.total')?.classList.toggle('is-active', !status);
            document.querySelector('.summary-chip.confirmed')?.classList.toggle('is-active', status === 'Đã đặt');
            document.querySelector('.summary-chip.completed')?.classList.toggle('is-active', status === 'Hoàn thành');
            document.querySelector('.summary-chip.cancelled')?.classList.toggle('is-active', status === 'Hủy');
        }

        async function loadPatients() {
            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-patients.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    const select = document.getElementById('patientSelect');
                    select.innerHTML = '<option value="">-- Chọn bệnh nhân --</option>' +
                        data.data.map(p => `<option value="${p.maBenhNhan}">${p.tenBenhNhan}</option>`).join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadDoctors() {
            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-doctors.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    const select = document.getElementById('doctorSelect');
                    select.innerHTML = '<option value="">-- Chọn bác sĩ --</option>' +
                        data.data.map(d => `<option value="${d.maBacSi}">${d.tenBacSi} - ${d.tenChuyenKhoa || 'N/A'}</option>`).join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadShifts() {
            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-shifts.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    allShifts = data.data;
                    const select = document.getElementById('shiftSelect');
                    select.innerHTML = '<option value="">-- Chọn ca --</option>' +
                        data.data.map(s => `<option value="${s.maCa}">${s.tenCa} (${s.gioBatDau} - ${s.gioKetThuc})</option>`).join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadTimeSlots() {
            const maCa = document.getElementById('shiftSelect').value;
            const slotSelect = document.getElementById('slotSelect');
            
            if (!maCa) {
                slotSelect.innerHTML = '<option value="">-- Chọn suất --</option>';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-slots.php?maCa=${maCa}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    allSlots = data.data;
                    slotSelect.innerHTML = '<option value="">-- Chọn suất --</option>' +
                        data.data.map(s => `<option value="${s.maSuat}">${s.gioBatDau} - ${s.gioKetThuc}</option>`).join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadPackages() {
            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-packages.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    allPackages = data.data;
                    const select = document.getElementById('packageSelect');
                    select.innerHTML = '<option value="">-- Chọn gói --</option>' +
                        data.data.map(p => `<option value="${p.maGoi}">${p.tenGoi} - ${formatCurrency(p.gia)}</option>`).join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Thêm lịch khám';
            document.getElementById('appointmentForm').reset();
            document.getElementById('appointmentId').value = '';
            currentEditingOriginalStatus = null;
            updateStatusSelectForContext(null, true);
            new bootstrap.Modal(document.getElementById('appointmentModal')).show();
        }

        async function editAppointment(id) {
            const apt = allAppointments.find(a => a.maLichKham == id);
            if (!apt) return;
            
            document.getElementById('modalTitle').textContent = 'Chỉnh sửa lịch khám';
            document.getElementById('appointmentId').value = id;
            document.getElementById('patientSelect').value = apt.maBenhNhan;
            document.getElementById('doctorSelect').value = apt.maBacSi;
            document.getElementById('appointmentDate').value = apt.ngayKham;
            document.getElementById('shiftSelect').value = apt.maCa;
            
            await loadTimeSlots();
            document.getElementById('slotSelect').value = apt.maSuat;
            document.getElementById('packageSelect').value = apt.maGoi || '';
            currentEditingOriginalStatus = apt.trangThai;
            updateStatusSelectForContext(currentEditingOriginalStatus, false);
            document.getElementById('appointmentStatus').value = apt.trangThai;
            document.getElementById('appointmentNote').value = apt.ghiChu || '';
            
            new bootstrap.Modal(document.getElementById('appointmentModal')).show();
        }

        async function viewAppointment(id) {
            const apt = allAppointments.find(a => a.maLichKham == id);
            if (!apt) return;
            
            const body = document.getElementById('viewModalBody');
            body.innerHTML = `
                <div class="row g-3">
                    <div class="col-md-6">
                        <strong>Mã lịch khám:</strong> ${apt.maLichKham}
                    </div>
                    <div class="col-md-6">
                        <strong>Trạng thái:</strong> ${getStatusBadge(apt.trangThai)}
                    </div>
                    <div class="col-md-6">
                        <strong>Bệnh nhân:</strong> ${apt.tenBenhNhan || 'N/A'}
                    </div>
                    <div class="col-md-6">
                        <strong>Bác sĩ:</strong> ${apt.tenBacSi || 'N/A'}
                    </div>
                    <div class="col-md-6">
                        <strong>Ngày khám:</strong> ${formatDate(apt.ngayKham)}
                    </div>
                    <div class="col-md-6">
                        <strong>Ca khám:</strong> ${apt.tenCa || 'N/A'}
                    </div>
                    <div class="col-md-6">
                        <strong>Suất khám:</strong> ${apt.gioSuat || 'N/A'}
                    </div>
                    <div class="col-md-6">
                        <strong>Gói khám:</strong> ${apt.tenGoi || 'N/A'}
                    </div>
                    <div class="col-md-6">
                        <strong>Chuyên khoa:</strong> ${apt.tenChuyenKhoa || 'N/A'}
                    </div>
                    <div class="col-md-6">
                        <strong>Khoa:</strong> ${apt.tenKhoa || 'N/A'}
                    </div>
                    <div class="col-12">
                        <strong>Ghi chú:</strong> ${apt.ghiChu || 'Không có'}
                    </div>
                </div>
            `;
            
            new bootstrap.Modal(document.getElementById('viewModal')).show();
        }

        async function deleteAppointment(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa lịch khám này?')) return;
            
            try {
                const response = await fetch(`${API_BASE_ADMIN}/delete-appointment.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ maLichKham: id })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('success', 'Xóa lịch khám thành công!');
                    loadAppointments();
                    loadStatistics();
                } else {
                    showAlert('error', data.message || 'Không thể xóa lịch khám');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('error', 'Lỗi kết nối đến server');
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('appointmentId').value;
            const data = {
                maBenhNhan: document.getElementById('patientSelect').value,
                maBacSi: document.getElementById('doctorSelect').value,
                ngayKham: document.getElementById('appointmentDate').value,
                maCa: parseInt(document.getElementById('shiftSelect').value),
                maSuat: parseInt(document.getElementById('slotSelect').value),
                maGoi: document.getElementById('packageSelect').value || null,
                trangThai: document.getElementById('appointmentStatus').value,
                ghiChu: document.getElementById('appointmentNote').value || null
            };
            
            if (id) data.maLichKham = id;

            if (id && !isStatusTransitionAllowed(currentEditingOriginalStatus, data.trangThai)) {
                showAlert('error', `Không thể đổi trạng thái từ "${currentEditingOriginalStatus}" sang "${data.trangThai}"`);
                return;
            }

            if (!id && data.trangThai !== 'Đã đặt') {
                showAlert('error', 'Lịch khám mới chỉ được tạo với trạng thái "Đã đặt"');
                return;
            }
            
            try {
                const url = id ? `${API_BASE_ADMIN}/update-appointment.php` : `${API_BASE_ADMIN}/create-appointment.php`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', id ? 'Cập nhật thành công!' : 'Thêm lịch khám thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('appointmentModal')).hide();
                    loadAppointments();
                    loadStatistics();
                } else {
                    showAlert('error', result.message || 'Có lỗi xảy ra');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('error', 'Lỗi kết nối đến server');
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN');
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        function getStatusBadge(status) {
            const badges = {
                'Đã đặt': '<span class="badge confirmed">Đã đặt</span>',
                'Hoàn thành': '<span class="badge completed">Hoàn thành</span>',
                'Hủy': '<span class="badge cancelled">Đã hủy</span>'
            };
            return badges[status] || status;
        }

        function isStatusTransitionAllowed(fromStatus, toStatus) {
            const allowed = STATUS_TRANSITIONS[fromStatus] || [fromStatus];
            return allowed.includes(toStatus);
        }

        function updateStatusSelectForContext(currentStatus, isCreate = false) {
            const select = document.getElementById('appointmentStatus');
            const helpText = document.getElementById('statusHelpText');
            const allowedStatuses = isCreate
                ? ['Đã đặt']
                : (STATUS_TRANSITIONS[currentStatus] || [currentStatus]);

            select.innerHTML = allowedStatuses.map(status => `<option value="${status}">${status}</option>`).join('');
            if (allowedStatuses.length > 0) {
                select.value = allowedStatuses[0];
            }

            if (isCreate) {
                helpText.textContent = 'Lịch mới được tạo ở trạng thái "Đã đặt".';
                return;
            }

            if (currentStatus === 'Hủy' || currentStatus === 'Hoàn thành') {
                helpText.textContent = `Trạng thái "${currentStatus}" là trạng thái kết thúc, không thể chuyển sang trạng thái khác.`;
                return;
            }

            helpText.textContent = '';
        }
    </script>
