<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bệnh Nhân</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-doctor-css" rel="stylesheet" href="assets/css/sidebar-doctor.css">
    <style>
        .summary-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #f8f9fb;
            border: 1px solid #e9ecef;
            color: #4c5665;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .summary-chip i {
            color: var(--primary-blue, #4A90E2);
        }

        .summary-chip strong {
            color: #1f2a37;
            font-size: 1rem;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .card-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0 0 20px 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-bar {
            background: #f6f9fc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .search-box input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898aa;
        }
        .search-box .search-clear-btn {
            right: 10px;
        }

        .form-select {
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .form-select:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 20px 0;
        }

        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #4A90E2;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: #357ABD;
        }

        .custom-table {
            width: 100%;
            margin: 0;
            border-collapse: collapse;
        }

        .custom-table thead {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
        }

        .custom-table thead th {
            border: none;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .custom-table tbody tr {
            transition: all 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }

        .custom-table tbody tr:hover {
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .custom-table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .patient-name {
            font-weight: 600;
            color: #333;
        }

        .patient-age {
            color: #666;
            font-size: 0.9rem;
        }

        .contact-text {
            font-size: 0.9rem;
            color: #495057;
            line-height: 1.5;
        }

        .contact-text .secondary {
            color: #7b8794;
            font-size: 0.82rem;
        }

        .record-snippet {
            font-size: 0.82rem;
            color: #6c757d;
            margin-top: 4px;
            line-height: 1.4;
        }

        .history-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            background: rgba(74, 144, 226, 0.1);
            color: #2f6fb2;
        }

        .visit-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .badge-new {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
        }

        .badge-revisit {
            background: linear-gradient(135deg, #ff9800, #ffa726);
            color: white;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            margin: 0 3px;
            transition: all 0.3s;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-view {
            background: #3498db;
            color: white;
        }

        .btn-view:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-history {
            background: #9c27b0;
            color: white;
        }

        .btn-history:hover {
            background: #7b1fa2;
            transform: translateY(-2px);
        }

        .actions-col {
            width: 58px;
            text-align: center;
        }
        .actions-cell {
            text-align: center;
            white-space: nowrap;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-blue, #4A90E2);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-blue, #4A90E2);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-blue, #4A90E2);
            border-color: var(--primary-blue, #4A90E2);
        }

        .modal-header {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        @media (max-width: 768px) {
            .summary-chips { gap: 8px; margin-bottom: 15px; }

            .section-card {
                padding: 15px;
            }

            .table-responsive {
                margin: 15px -15px;
                padding: 0 15px;
            }

            .custom-table {
                font-size: 0.85rem;
                min-width: 700px;
            }

            .custom-table thead th,
            .custom-table tbody td {
                padding: 10px 8px;
            }

            .btn-action {
                padding: 5px 8px;
                font-size: 0.8rem;
                margin: 2px;
            }

            .btn-action i {
                margin: 0;
            }

            .visit-badge {
                font-size: 0.75rem;
                padding: 4px 8px;
            }

            .patient-name {
                font-size: 0.9rem;
            }

            .patient-age {
                font-size: 0.8rem;
            }

            .filter-bar {
                padding: 15px;
            }

            .pagination-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            #recordInfo {
                order: 2;
            }

            .pagination {
                order: 1;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="summary-chips">
            <div class="summary-chip"><i class="fas fa-users"></i>Tổng bệnh nhân: <strong id="totalPatients">0</strong></div>
            <div class="summary-chip"><i class="fas fa-user-plus"></i>Khám mới: <strong id="newPatients">0</strong></div>
            <div class="summary-chip"><i class="fas fa-user-check"></i>Tái khám: <strong id="revisitPatients">0</strong></div>
            <div class="summary-chip"><i class="fas fa-clock"></i>Gần đây (7 ngày): <strong id="recentPatients">0</strong></div>
        </div>

        <div class="section-card">
            <div class="card-header table-header">
                <h5><i class="fas fa-list me-2"></i>Danh sách bệnh nhân</h5>
                <div class="table-header-actions">
                    <button class="sort-toggle-btn" id="sortToggleBtn" type="button" onclick="toggleSortOrder()" aria-label="Đổi thứ tự thời gian">
                        <i id="sortToggleIcon" class="fas fa-sort-amount-down"></i>
                    </button>
                </div>
            </div>
            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="search-box filter-control-wrap"><i class="fas fa-search"></i><input type="text" class="form-control"
                                id="searchInput" placeholder="Tìm theo tên, SĐT, email, chẩn đoán gần nhất..." oninput="applyFilters()"><button type="button" class="filter-clear-btn" id="clearSearchBtn" aria-label="Xóa từ khóa tìm kiếm" onclick="clearSearch()">×</button></div>
                    </div>
                    <div class="col-md-2"><select class="form-select" id="visitTypeFilter" onchange="applyFilters()">
                            <option value="">Tất cả loại khám</option>
                            <option value="1">Khám mới</option>
                            <option value="2+">Tái khám</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select" id="genderFilter" onchange="applyFilters()">
                            <option value="">Tất cả giới tính</option>
                            <option value="nam">Nam</option>
                            <option value="nu">Nữ</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select" id="sortFilter" onchange="applyFilters()">
                            <option value="name">Tên A-Z</option>
                            <option value="visits">Số lần khám</option>
                        </select></div>
                </div>
            </div>
            <div id="loadingIndicator" class="text-center py-5" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải...</p>
            </div>
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Bệnh nhân</th>
                            <th>Giới tính</th>
                            <th>Liên hệ</th>
                            <th>Số lần khám</th>
                            <th>Lần khám gần nhất</th>
                            <th class="actions-col"><i class="fas fa-cog"></i></th>
                        </tr>
                    </thead>
                    <tbody id="patientList"></tbody>
                </table>
            </div>
            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 bệnh nhân</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <div class="modal fade" id="viewPatientModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user me-2"></i>Thông tin bệnh nhân</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="patientDetails"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" onclick="viewMedicalHistory()"><i
                            class="fas fa-history me-1"></i>Xem lịch sử bệnh án</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/doctor-page-helper.js"></script>
    <script src="assets/js/sidebar-doctor.js"></script>
    <script>
        const API_BASE = window.DoctorPageHelper.doctorApiBase;

        let currentPage = 1;
        const itemsPerPage = 10;
        let currentPatients = [];
        let totalPatientsCount = 0;
        let currentPatientId = null;
        let sortOrder = 'desc';

        document.addEventListener('DOMContentLoaded', function () {
            window.DoctorPageHelper.syncSearchClearButton('searchInput', 'clearSearchBtn');
            syncSortToggle();
            loadPatients(1);
        });

        function buildPatientQuery(page = 1) {
            const params = new URLSearchParams();
            params.set('page', String(page));
            params.set('limit', String(itemsPerPage));

            const search = document.getElementById('searchInput')?.value?.trim() || '';
            const visitType = document.getElementById('visitTypeFilter')?.value || '';
            const gender = document.getElementById('genderFilter')?.value || '';
            const sort = document.getElementById('sortFilter')?.value || 'name';
            params.set('order', sortOrder);

            if (search) params.set('search', search);
            if (visitType) params.set('visitType', visitType);
            if (gender) params.set('gender', gender);
            if (sort) params.set('sort', sort);

            return params.toString();
        }

        async function loadPatients(page = 1) {
            showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/get-patients.php?${buildPatientQuery(page)}`, { credentials: 'include' });
                const data = await response.json();
                if (data.success) {
                    currentPatients = (data.data || []).map(patient => ({
                        ...patient,
                        soLanKham: Number(patient.soLanKham || 0)
                    }));
                    totalPatientsCount = Number(data.pagination?.total || 0);
                    currentPage = Number(data.pagination?.page || page || 1);
                    updateStats(data.stats || {});
                    displayPatients();
                }
                else { showError(data.message); handleSessionExpired(data.message); }
            } catch (error) { console.error('Error:', error); showError('Lỗi kết nối server'); handleSessionExpired("fetch_failed"); }
            finally { showLoading(false); }
        }

        function updateStats(stats) {
            animateNumber('totalPatients', Number(stats.totalPatients || 0));
            animateNumber('newPatients', Number(stats.newPatients || 0));
            animateNumber('revisitPatients', Number(stats.revisitPatients || 0));
            animateNumber('recentPatients', Number(stats.recentPatients || 0));
        }

        function displayPatients() {
            const tbody = document.getElementById('patientList');
            if (currentPatients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5">Không có bệnh nhân</td></tr>';
                updatePagination();
                return;
            }

            tbody.innerHTML = currentPatients.map((patient) => {
                const age = calculateAge(patient.ngaySinh);
                const visitBadge = patient.soLanKham === 1 ? `<span class="visit-badge badge-new"><i class="fas fa-star me-1"></i>Mới</span>` : `<span class="visit-badge badge-revisit"><i class="fas fa-redo me-1"></i>${patient.soLanKham} lần</span>`;
                const lastVisit = patient.lanKhamGanNhat ? new Date(patient.lanKhamGanNhat).toLocaleDateString('vi-VN') : 'Chưa có';
                const contactPhone = patient.soDienThoai || 'Chưa có SĐT';
                const contactEmail = patient.email || 'Chưa có email';
                const latestSnippet = patient.chanDoanGanNhat ? truncateText(patient.chanDoanGanNhat, 70) : 'Chưa có chẩn đoán';
                const actions = [
                    { label: 'Xem chi tiết', icon: 'fa-eye', onClick: `viewPatient('${patient.maBenhNhan}')`, variant: 'view' },
                    { label: 'Lịch sử khám', icon: 'fa-history', onClick: `viewHistory('${patient.maBenhNhan}')`, variant: 'history' }
                ];
                return `
                    <tr>
                        <td><div class="patient-name">${patient.tenBenhNhan}</div><div class="patient-age">${age} tuổi</div></td>
                        <td>${patient.gioiTinh}</td>
                        <td><div class="contact-text">${contactPhone}<div class="secondary">${contactEmail}</div></div></td>
                        <td>${visitBadge}</td>
                        <td><div>${lastVisit}</div><div class="record-snippet">${latestSnippet}</div></td>
                        <td class="actions-cell">${window.DoctorPageHelper.renderTableActions(actions)}</td>
                    </tr>
                `;
            }).join('');
            updatePagination();
        }

        function updatePagination() {
            const totalPages = totalPatientsCount > 0 ? Math.ceil(totalPatientsCount / itemsPerPage) : 0;
            const container = document.getElementById('paginationContainer');
            if (totalPatientsCount === 0) {
                document.getElementById('recordInfo').textContent = 'Hiển thị 0 - 0 của 0 bệnh nhân';
                container.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, totalPatientsCount);
            document.getElementById('recordInfo').textContent = `Hiển thị ${start} - ${end} của ${totalPatientsCount} bệnh nhân`;
            let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;"><i class="fas fa-chevron-left"></i></a></li>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
                else if (i === currentPage - 2 || i === currentPage + 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;"><i class="fas fa-chevron-right"></i></a></li>`;
            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = totalPatientsCount > 0 ? Math.ceil(totalPatientsCount / itemsPerPage) : 0;
            if (page >= 1 && page <= totalPages) {
                loadPatients(page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function applyFilters() {
            currentPage = 1;
            window.DoctorPageHelper.syncSearchClearButton('searchInput', 'clearSearchBtn');
            loadPatients(1);
        }

        function clearSearch() {
            window.DoctorPageHelper.clearSearchInput('searchInput', 'clearSearchBtn', 'applyFilters');
        }

        function toggleSortOrder() {
            sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
            syncSortToggle();
            loadPatients(1);
        }

        function syncSortToggle() {
            const btn = document.getElementById('sortToggleBtn');
            const icon = document.getElementById('sortToggleIcon');
            if (!btn || !icon) return;
            const isDesc = sortOrder === 'desc';
            icon.className = `fas ${isDesc ? 'fa-sort-amount-down' : 'fa-sort-amount-up'}`;
            btn.title = isDesc ? 'Đang sắp xếp: mới nhất trước' : 'Đang sắp xếp: cũ nhất trước';
        }

        async function viewPatient(maBenhNhan) {
            const patient = currentPatients.find(p => String(p.maBenhNhan) === String(maBenhNhan));
            if (!patient) return;
            currentPatientId = maBenhNhan;
            const age = calculateAge(patient.ngaySinh);
            const latestVisit = patient.lanKhamGanNhat ? new Date(patient.lanKhamGanNhat).toLocaleDateString('vi-VN') : 'Chưa có';
            const firstVisit = patient.lanKhamDauTien ? new Date(patient.lanKhamDauTien).toLocaleDateString('vi-VN') : 'Chưa có';
            document.getElementById('patientDetails').innerHTML = `
                <div class="row">
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-user me-2"></i>Họ và tên:</strong><p>${patient.tenBenhNhan}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-birthday-cake me-2"></i>Tuổi:</strong><p>${age} tuổi (${new Date(patient.ngaySinh).toLocaleDateString('vi-VN')})</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-venus-mars me-2"></i>Giới tính:</strong><p>${patient.gioiTinh}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-phone me-2"></i>Số điện thoại:</strong><p>${patient.soDienThoai || 'Chưa có'}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-envelope me-2"></i>Email:</strong><p>${patient.email || 'Chưa có'}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-id-card me-2"></i>Mã bệnh nhân:</strong><p>${patient.maBenhNhan}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-redo me-2"></i>Số lần khám hoàn tất:</strong><p>${patient.soLanKham} lần</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-calendar-plus me-2"></i>Lần khám đầu tiên:</strong><p>${firstVisit}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-calendar-check me-2"></i>Lần khám gần nhất:</strong><p>${latestVisit}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-file-medical me-2"></i>Hồ sơ gần nhất:</strong><p>${patient.maHoSoGanNhat || 'Chưa có'}</p></div>
                    <div class="col-md-12 mb-3"><strong style="color:#4A90E2"><i class="fas fa-stethoscope me-2"></i>Chẩn đoán gần nhất:</strong><p>${patient.chanDoanGanNhat || 'Chưa có'}</p></div>
                    ${patient.soTheBHYT ? `<div class="col-md-12 mb-3"><strong style="color:#4A90E2"><i class="fas fa-id-card-alt me-2"></i>Số thẻ BHYT:</strong><p>${patient.soTheBHYT}</p></div>` : ''}
                </div>
            `;
            new bootstrap.Modal(document.getElementById('viewPatientModal')).show();
        }

        async function viewHistory(maBenhNhan) {
            try {
                const response = await fetch(`${API_BASE}/get-patient-history.php?maBenhNhan=${maBenhNhan}`, { credentials: 'include' });
                const data = await response.json();
                if (data.success) showHistoryModal(data.data, maBenhNhan);
                else showAlert('error', data.message);
            } catch (error) { console.error('Error:', error); showAlert('error', 'Lỗi kết nối server'); }
        }

        function viewMedicalHistory() { if (currentPatientId) viewHistory(currentPatientId); }

        function showHistoryModal(history, maBenhNhan) {
            const patient = currentPatients.find(p => String(p.maBenhNhan) === String(maBenhNhan));
            if (!history || history.length === 0) { showAlert('info', 'Chưa có lịch sử khám bệnh'); return; }
            const patientName = patient?.tenBenhNhan || maBenhNhan;
            let html = `<div class="modal-dialog modal-dialog-centered modal-xl"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="fas fa-history me-2"></i>Lịch sử bệnh án - ${patientName}</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Ngày khám</th><th>Hồ sơ</th><th>Ca / Gói</th><th>Chẩn đoán</th><th>Điều trị</th><th>Toa thuốc</th><th class="actions-col"><i class="fas fa-cog"></i></th></tr></thead><tbody>${history.map(h => `<tr><td><div>${formatDate(h.ngayKham)}</div><div class="record-snippet">${h.ngayHoanThanh ? `Hoàn tất ${formatDateTime(h.ngayHoanThanh)}` : ''}</div></td><td><div class="fw-semibold">${h.maHoSo}</div><div class="record-snippet">${truncateText(h.ghiChu || 'Không có ghi chú', 60)}</div></td><td><div>${h.tenCa || 'N/A'}</div><div class="record-snippet">${h.tenGoi || 'Chưa có gói khám'}${h.gioBatDau ? ` • ${h.gioBatDau.substring(0, 5)} - ${h.gioKetThuc.substring(0, 5)}` : ''}</div></td><td>${truncateText(h.chanDoan || 'Chưa cập nhật', 90)}</td><td>${truncateText(h.dieuTri || 'Chưa cập nhật', 90)}</td><td>${Number(h.soThuoc) > 0 ? `<span class="history-badge"><i class="fas fa-capsules"></i>${Number(h.soThuoc)} thuốc</span>` : '<span class="text-muted">Không có</span>'}${h.loiDanBacSi ? `<div class="record-snippet">${truncateText(h.loiDanBacSi, 70)}</div>` : ''}</td><td class="actions-cell"><a class="btn btn-sm btn-outline-primary" href="ho-so-benh-an.html?view=${encodeURIComponent(h.maHoSo)}"><i class="fas fa-eye me-1"></i>Xem hồ sơ</a></td></tr>`).join('')}</tbody></table></div></div></div></div>`;
            const existingModal = document.querySelector('#viewPatientModal');
            if (existingModal) bootstrap.Modal.getInstance(existingModal)?.hide();
            const tempDiv = document.createElement('div');
            tempDiv.className = 'modal fade'; tempDiv.innerHTML = html; document.body.appendChild(tempDiv);
            const modal = new bootstrap.Modal(tempDiv); modal.show();
            tempDiv.addEventListener('hidden.bs.modal', () => { document.body.removeChild(tempDiv); });
        }

        function calculateAge(birthDate) { const birth = new Date(birthDate); const today = new Date(); let age = today.getFullYear() - birth.getFullYear(); const m = today.getMonth() - birth.getMonth(); if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--; return age; }
        function truncateText(value, maxLength = 60) { const text = (value || '').toString().trim(); return text.length > maxLength ? `${text.slice(0, maxLength)}...` : (text || ''); }
        function formatDate(value) { return value ? new Date(value).toLocaleDateString('vi-VN') : 'N/A'; }
        function formatDateTime(value) { return value ? new Date(value).toLocaleString('vi-VN') : ''; }
        function animateNumber(elementId, targetNumber) { const el = document.getElementById(elementId); if (!el) return; let cur = 0; const inc = targetNumber / 50; const timer = setInterval(() => { cur += inc; if (cur >= targetNumber) { el.textContent = targetNumber; clearInterval(timer); } else { el.textContent = Math.floor(cur); } }, 20); }
        function showLoading(show) { document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none'; document.querySelector('.table-responsive').style.display = show ? 'none' : 'block'; }
        function showError(message) { document.getElementById('patientList').innerHTML = `<tr><td colspan="6" class="text-center py-5 text-danger">${message}</td></tr>`; }
    </script>
</body>

</html>
