<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bệnh Nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-doctor-css" rel="stylesheet" href="assets/css/sidebar-doctor.css">
    <style>
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            border-radius: 0 0 0 100%;
            opacity: 0.1;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .stat-card.total::before {
            background: #3498db;
        }

        .stat-card.new::before {
            background: #4caf50;
        }

        .stat-card.revisit::before {
            background: #ff9800;
        }

        .stat-card.recent::before {
            background: #e91e63;
        }

        .stat-card.total::after {
            background: #3498db;
        }

        .stat-card.new::after {
            background: #4caf50;
        }

        .stat-card.revisit::after {
            background: #ff9800;
        }

        .stat-card.recent::after {
            background: #e91e63;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            margin: 0 0 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.1), rgba(82, 196, 26, 0.1));
            color: var(--primary-blue, #4A90E2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .card-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0 0 20px 0;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-bar {
            background: #f6f9fc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .search-box input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898aa;
        }

        .form-select {
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .form-select:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 20px 0;
        }

        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #4A90E2;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: #357ABD;
        }

        .custom-table {
            width: 100%;
            margin: 0;
            border-collapse: collapse;
        }

        .custom-table thead {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
        }

        .custom-table thead th {
            border: none;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .custom-table tbody tr {
            transition: all 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }

        .custom-table tbody tr:hover {
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .custom-table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .patient-name {
            font-weight: 600;
            color: #333;
        }

        .patient-age {
            color: #666;
            font-size: 0.9rem;
        }

        .visit-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .badge-new {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
        }

        .badge-revisit {
            background: linear-gradient(135deg, #ff9800, #ffa726);
            color: white;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            margin: 0 3px;
            transition: all 0.3s;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-view {
            background: #3498db;
            color: white;
        }

        .btn-view:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-history {
            background: #9c27b0;
            color: white;
        }

        .btn-history:hover {
            background: #7b1fa2;
            transform: translateY(-2px);
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-blue, #4A90E2);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-blue, #4A90E2);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-blue, #4A90E2);
            border-color: var(--primary-blue, #4A90E2);
        }

        .modal-header {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .section-card {
                padding: 15px;
            }

            .table-responsive {
                margin: 15px -15px;
                padding: 0 15px;
            }

            .custom-table {
                font-size: 0.85rem;
                min-width: 700px;
            }

            .custom-table thead th,
            .custom-table tbody td {
                padding: 10px 8px;
            }

            .btn-action {
                padding: 5px 8px;
                font-size: 0.8rem;
                margin: 2px;
            }

            .btn-action i {
                margin: 0;
            }

            .visit-badge {
                font-size: 0.75rem;
                padding: 4px 8px;
            }

            .patient-name {
                font-size: 0.9rem;
            }

            .patient-age {
                font-size: 0.8rem;
            }

            .filter-bar {
                padding: 15px;
            }

            .pagination-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            #recordInfo {
                order: 2;
            }

            .pagination {
                order: 1;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="stats-row">
            <div class="stat-card total">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-number" id="totalPatients">0</div>
                <div class="stat-label">Tổng bệnh nhân</div>
            </div>
            <div class="stat-card new">
                <div class="stat-icon"><i class="fas fa-user-plus"></i></div>
                <div class="stat-number" id="newPatients">0</div>
                <div class="stat-label">Khám mới</div>
            </div>
            <div class="stat-card revisit">
                <div class="stat-icon"><i class="fas fa-user-check"></i></div>
                <div class="stat-number" id="revisitPatients">0</div>
                <div class="stat-label">Tái khám</div>
            </div>
            <div class="stat-card recent">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-number" id="recentPatients">0</div>
                <div class="stat-label">Gần đây (7 ngày)</div>
            </div>
        </div>

        <div class="section-card">
            <div class="card-header">
                <h5><i class="fas fa-list me-2"></i>Danh sách bệnh nhân</h5>
            </div>
            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box"><i class="fas fa-search"></i><input type="text" class="form-control"
                                id="searchInput" placeholder="Tìm theo tên, SĐT..."></div>
                    </div>
                    <div class="col-md-2"><select class="form-select" id="visitTypeFilter">
                            <option value="">Tất cả loại khám</option>
                            <option value="1">Khám mới</option>
                            <option value="2+">Tái khám</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select" id="genderFilter">
                            <option value="">Tất cả giới tính</option>
                            <option value="nam">Nam</option>
                            <option value="nu">Nữ</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select" id="sortFilter">
                            <option value="recent">Gần đây nhất</option>
                            <option value="name">Tên A-Z</option>
                            <option value="visits">Số lần khám</option>
                        </select></div>
                    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="applyFilters()"><i
                                class="fas fa-filter me-1"></i>Lọc</button></div>
                </div>
            </div>
            <div id="loadingIndicator" class="text-center py-5" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải...</p>
            </div>
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Bệnh nhân</th>
                            <th>Giới tính</th>
                            <th>Số điện thoại</th>
                            <th>Số lần khám</th>
                            <th>Lần khám gần nhất</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="patientList"></tbody>
                </table>
            </div>
            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 bệnh nhân</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <div class="modal fade" id="viewPatientModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user me-2"></i>Thông tin bệnh nhân</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="patientDetails"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary" onclick="viewMedicalHistory()"><i
                            class="fas fa-history me-1"></i>Xem lịch sử khám</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/sidebar-doctor.js"></script>    
    <script>
        const COMPONENT_PATH = 'components/';
        const API_BASE_DOCTOR = window.API_ENDPOINTS.doctor;
        const API_BASE_AUTH = window.API_ENDPOINTS.auth;
        var DOCTOR_INFO = {};
    </script>
    <script>
        const API_BASE = window.API_ENDPOINTS.doctor;

        let currentPage = 1;
        const itemsPerPage = 10;
        let allPatients = [];
        let filteredPatients = [];
        let currentPatientId = null;

        document.addEventListener('DOMContentLoaded', function () {
            loadPatients();
            document.getElementById('searchInput').addEventListener('input', () => { applyFilters(); });
        });

        async function loadPatients() {
            showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/get-patients.php`, { credentials: 'include' });
                const data = await response.json();
                if (data.success) { allPatients = data.data; filteredPatients = [...allPatients]; updateStats(); displayPatients(); }
                else { showError(data.message); handleSessionExpired(data.message); }
            } catch (error) { console.error('Error:', error); showError('Lỗi kết nối server'); handleSessionExpired("fetch_failed"); }
            finally { showLoading(false); }
        }

        function updateStats() {
            const total = allPatients.length;
            const newP = allPatients.filter(p => p.soLanKham === 1).length;
            const revisitP = allPatients.filter(p => p.soLanKham > 1).length;
            const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            const recentP = allPatients.filter(p => new Date(p.lanKhamGanNhat) >= sevenDaysAgo).length;
            animateNumber('totalPatients', total);
            animateNumber('newPatients', newP);
            animateNumber('revisitPatients', revisitP);
            animateNumber('recentPatients', recentP);
        }

        function displayPatients() {
            const tbody = document.getElementById('patientList');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredPatients.slice(start, end);
            if (pageData.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5">Không có bệnh nhân</td></tr>'; return; }
            tbody.innerHTML = pageData.map((patient, index) => {
                const age = calculateAge(patient.ngaySinh);
                const visitBadge = patient.soLanKham === 1 ? `<span class="visit-badge badge-new"><i class="fas fa-star me-1"></i>Mới</span>` : `<span class="visit-badge badge-revisit"><i class="fas fa-redo me-1"></i>${patient.soLanKham} lần</span>`;
                const lastVisit = new Date(patient.lanKhamGanNhat).toLocaleDateString('vi-VN');
                return `
                    <tr>
                        <td><strong>${start + index + 1}</strong></td>
                        <td><div class="patient-name">${patient.tenBenhNhan}</div><div class="patient-age">${age} tuổi</div></td>
                        <td>${patient.gioiTinh}</td>
                        <td>${patient.soDienThoai || 'Chưa có'}</td>
                        <td>${visitBadge}</td>
                        <td>${lastVisit}</td>
                        <td>
                            <button class="btn-action btn-view" onclick="viewPatient('${patient.maBenhNhan}')" title="Xem chi tiết"><i class="fas fa-eye"></i></button>
                            <button class="btn-action btn-history" onclick="viewHistory('${patient.maBenhNhan}')" title="Lịch sử khám"><i class="fas fa-history"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredPatients.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredPatients.length);
            document.getElementById('recordInfo').textContent = `Hiển thị ${start} - ${end} của ${filteredPatients.length} bệnh nhân`;
            let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;"><i class="fas fa-chevron-left"></i></a></li>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
                else if (i === currentPage - 2 || i === currentPage + 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;"><i class="fas fa-chevron-right"></i></a></li>`;
            container.innerHTML = html;
        }

        function changePage(page) { const totalPages = Math.ceil(filteredPatients.length / itemsPerPage); if (page >= 1 && page <= totalPages) { currentPage = page; displayPatients(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const visitType = document.getElementById('visitTypeFilter').value;
            const gender = document.getElementById('genderFilter').value;
            const sort = document.getElementById('sortFilter').value;
            filteredPatients = allPatients.filter(patient => {
                let match = true;
                if (search) { const searchStr = `${patient.tenBenhNhan} ${patient.soDienThoai}`.toLowerCase(); if (!searchStr.includes(search)) match = false; }
                if (visitType === '1' && patient.soLanKham !== 1) match = false;
                if (visitType === '2+' && patient.soLanKham <= 1) match = false;
                if (gender && patient.gioiTinh.toLowerCase() !== gender) match = false;
                return match;
            });
            if (sort === 'name') filteredPatients.sort((a, b) => a.tenBenhNhan.localeCompare(b.tenBenhNhan));
            else if (sort === 'visits') filteredPatients.sort((a, b) => b.soLanKham - a.soLanKham);
            else if (sort === 'recent') filteredPatients.sort((a, b) => new Date(b.lanKhamGanNhat) - new Date(a.lanKhamGanNhat));
            currentPage = 1; displayPatients();
        }

        async function viewPatient(maBenhNhan) {
            const patient = allPatients.find(p => p.maBenhNhan === maBenhNhan);
            if (!patient) return;
            currentPatientId = maBenhNhan;
            const age = calculateAge(patient.ngaySinh);
            document.getElementById('patientDetails').innerHTML = `
                <div class="row">
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-user me-2"></i>Họ và tên:</strong><p>${patient.tenBenhNhan}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-birthday-cake me-2"></i>Tuổi:</strong><p>${age} tuổi (${new Date(patient.ngaySinh).toLocaleDateString('vi-VN')})</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-venus-mars me-2"></i>Giới tính:</strong><p>${patient.gioiTinh}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-phone me-2"></i>Số điện thoại:</strong><p>${patient.soDienThoai || 'Chưa có'}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-id-card me-2"></i>Mã bệnh nhân:</strong><p>${patient.maBenhNhan}</p></div>
                    <div class="col-md-6 mb-3"><strong style="color:#4A90E2"><i class="fas fa-redo me-2"></i>Số lần khám:</strong><p>${patient.soLanKham} lần</p></div>
                    <div class="col-md-12 mb-3"><strong style="color:#4A90E2"><i class="fas fa-calendar me-2"></i>Lần khám gần nhất:</strong><p>${new Date(patient.lanKhamGanNhat).toLocaleDateString('vi-VN')}</p></div>
                    ${patient.soTheBHYT ? `<div class="col-md-12 mb-3"><strong style="color:#4A90E2"><i class="fas fa-id-card-alt me-2"></i>Số thẻ BHYT:</strong><p>${patient.soTheBHYT}</p></div>` : ''}
                </div>
            `;
            new bootstrap.Modal(document.getElementById('viewPatientModal')).show();
        }

        async function viewHistory(maBenhNhan) {
            try {
                const response = await fetch(`${API_BASE}/get-patient-history.php?maBenhNhan=${maBenhNhan}`, { credentials: 'include' });
                const data = await response.json();
                if (data.success) showHistoryModal(data.data, maBenhNhan);
                else showAlert('error', data.message);
            } catch (error) { console.error('Error:', error); showAlert('error', 'Lỗi kết nối server'); }
        }

        function viewMedicalHistory() { if (currentPatientId) viewHistory(currentPatientId); }

        function showHistoryModal(history, maBenhNhan) {
            const patient = allPatients.find(p => p.maBenhNhan === maBenhNhan);
            if (!history || history.length === 0) { showAlert('info', 'Chưa có lịch sử khám bệnh'); return; }
            let html = `<div class="modal-dialog modal-dialog-centered modal-xl"><div class="modal-content"><div class="modal-header"><h5 class="modal-title"><i class="fas fa-history me-2"></i>Lịch sử khám bệnh - ${patient.tenBenhNhan}</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Ngày khám</th><th>Ca</th><th>Gói khám</th><th>Trạng thái</th></tr></thead><tbody>${history.map(h => `<tr><td>${new Date(h.ngayKham).toLocaleDateString('vi-VN')}</td><td>${h.tenCa}</td><td>${h.tenGoi}</td><td><span class="badge bg-${h.trangThai === 'Hoàn thành' ? 'success' : 'warning'}">${h.trangThai}</span></td></tr>`).join('')}</tbody></table></div></div></div></div>`;
            const existingModal = document.querySelector('#viewPatientModal');
            if (existingModal) bootstrap.Modal.getInstance(existingModal)?.hide();
            const tempDiv = document.createElement('div');
            tempDiv.className = 'modal fade'; tempDiv.innerHTML = html; document.body.appendChild(tempDiv);
            const modal = new bootstrap.Modal(tempDiv); modal.show();
            tempDiv.addEventListener('hidden.bs.modal', () => { document.body.removeChild(tempDiv); });
        }

        function calculateAge(birthDate) { const birth = new Date(birthDate); const today = new Date(); let age = today.getFullYear() - birth.getFullYear(); const m = today.getMonth() - birth.getMonth(); if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--; return age; }
        function animateNumber(elementId, targetNumber) { const el = document.getElementById(elementId); if (!el) return; let cur = 0; const inc = targetNumber / 50; const timer = setInterval(() => { cur += inc; if (cur >= targetNumber) { el.textContent = targetNumber; clearInterval(timer); } else { el.textContent = Math.floor(cur); } }, 20); }
        function showLoading(show) { document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none'; document.querySelector('.table-responsive').style.display = show ? 'none' : 'block'; }
        function showError(message) { document.getElementById('patientList').innerHTML = `<tr><td colspan="7" class="text-center py-5 text-danger">${message}</td></tr>`; }
    </script>
</body>

</html>
