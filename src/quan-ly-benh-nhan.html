<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bệnh Nhân</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-admin-css" rel="stylesheet" href="assets/css/sidebar-admin.css">
    <style>
.stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            border-radius: 0 0 0 100%;
            opacity: 0.1;
        }

        .stat-card.total::before {background: linear-gradient(90deg, #667eea, #764ba2);}
        .stat-card.male::before {background: linear-gradient(90deg, #00AEEF, #0088cc);}
        .stat-card.female::before {background: linear-gradient(90deg, #ff6b9d, #ee5a6f);}
        .stat-card.bhyt::before {background: linear-gradient(90deg, #28a745, #20c997);}
        .stat-card.total::after {background: linear-gradient(90deg, #667eea, #764ba2);}
        .stat-card.male::after {background: linear-gradient(90deg, #00AEEF, #0088cc);}
        .stat-card.female::after {background: linear-gradient(90deg, #ff6b9d, #ee5a6f);}
        .stat-card.bhyt::after {background: linear-gradient(90deg, #28a745, #20c997);}

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .stat-card.total .stat-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .stat-card.male .stat-icon {
            background: linear-gradient(135deg, #00AEEF, #0088cc);
            color: white;
        }

        .stat-card.female .stat-icon {
            background: linear-gradient(135deg, #ff6b9d, #ee5a6f);
            color: white;
        }

        .stat-card.bhyt .stat-icon {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin: 10px 0;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .filter-section h5 {
            color: var(--primary-purple);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .table-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
        }

        .custom-table thead th {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            color: #495057;
            font-weight: 600;
            padding: 15px;
            border: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-table tbody tr {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .custom-table tbody tr:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .custom-table tbody td {
            padding: 15px;
            border: none;
            vertical-align: middle;
        }

        .custom-table tbody tr td:first-child {
            border-radius: 8px 0 0 8px;
        }

        .custom-table tbody tr td:last-child {
            border-radius: 0 8px 8px 0;
        }

        .gender-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .gender-badge.male {
            background: #e3f2fd;
            color: #1976d2;
        }

        .gender-badge.female {
            background: #fce4ec;
            color: #c2185b;
        }

        .bhyt-badge {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .no-bhyt {
            color: #999;
            font-style: italic;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 3px;
            transition: all 0.3s;
        }

        .btn-view {
            background: #e3f2fd;
            color: #1976d2;
        }

        .btn-view:hover {
            background: #1976d2;
            color: white;
        }

        .btn-edit {
            background: #fff3cd;
            color: #856404;
        }

        .btn-edit:hover {
            background: #ffc107;
            color: white;
        }

        .btn-delete {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-delete:hover {
            background: #dc3545;
            color: white;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 20px 25px;
        }

        .modal-title {
            font-weight: 700;
        }

        .modal-body {
            padding: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 15px;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .patient-detail-card {
            border: 1px solid #edf0f5;
            border-radius: 14px;
            padding: 20px;
            background: #ffffff;
        }

        .patient-detail-hero {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid #edf0f5;
        }

        .patient-detail-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .patient-detail-name {
            margin: 0 0 6px 0;
            font-weight: 700;
            color: #22314a;
        }

        .patient-detail-code {
            margin: 0;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .patient-detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .patient-detail-item {
            background: #f8fafc;
            border: 1px solid #edf0f5;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .patient-detail-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.35px;
            color: #718198;
            margin-bottom: 6px;
        }

        .patient-detail-value {
            color: #1f2d3d;
            font-weight: 600;
            word-break: break-word;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 0.3rem;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-purple);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-purple);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-purple);
            border-color: var(--primary-purple);
        }

@media (max-width: 768px) {

.stats-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .btn-add {
                width: 100%;
            }

            .custom-table {
                font-size: 0.85rem;
            }

            .custom-table thead th,
            .custom-table tbody td {
                padding: 10px 8px;
            }

}
            /* mobile-stat-row-fix */
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
                gap: 8px !important;
            }

            .stat-card {
                padding: 10px 8px !important;
                border-radius: 12px;
            }

            .stat-icon {
                width: 36px;
                height: 36px;
                font-size: 1rem;
                border-radius: 8px;
                margin-bottom: 8px;
            }

            .stat-number {
                font-size: 1.05rem !important;
                margin: 6px 0 !important;
                line-height: 1.2;
            }

            .stat-label {
                font-size: 0.72rem !important;
                line-height: 1.25;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <!-- Statistics -->
        <div class="stats-row">
            <div class="stat-card total" onclick="scrollToSection('benhnhanSection')">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-number" id="totalPatients">0</div>
                <div class="stat-label">Tổng số bệnh nhân</div>
            </div>
            <div class="stat-card male">
                <div class="stat-icon">
                    <i class="fas fa-male"></i>
                </div>
                <div class="stat-number" id="maleCount">0</div>
                <div class="stat-label">Bệnh nhân nam</div>
            </div>
            <div class="stat-card female">
                <div class="stat-icon">
                    <i class="fas fa-female"></i>
                </div>
                <div class="stat-number" id="femaleCount">0</div>
                <div class="stat-label">Bệnh nhân nữ</div>
            </div>
            <div class="stat-card bhyt">
                <div class="stat-icon">
                    <i class="fas fa-id-card"></i>
                </div>
                <div class="stat-number" id="bhytCount">0</div>
                <div class="stat-label">Có BHYT</div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <h5><i class="fas fa-filter me-2"></i>Bộ lọc</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Giới tính</label>
                    <select class="form-select" id="filterGender">
                        <option value="">Tất cả</option>
                        <option value="nam">Nam</option>
                        <option value="nu">Nữ</option>
                        <option value="khac">Khác</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">BHYT</label>
                    <select class="form-select" id="filterBHYT">
                        <option value="">Tất cả</option>
                        <option value="co">Có BHYT</option>
                        <option value="khong">Không có</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tìm kiếm</label>
                    <input type="text" class="form-control" id="filterSearch" placeholder="Tên, mã BN, SĐT, email...">
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary" onclick="applyFilters()">
                    <i class="fas fa-search me-2"></i>Tìm kiếm
                </button>
                <button class="btn btn-secondary" onclick="resetFilters()">
                    <i class="fas fa-redo me-2"></i>Đặt lại
                </button>
            </div>
        </div>

        <section id="benhnhanSection"></section>

        <!-- Table Section -->
        <div class="table-section">
            <div class="table-header">
                <h5><i class="fas fa-list me-2"></i>Danh sách bệnh nhân</h5>
                <button class="btn-add" onclick="openAddModal()">
                    <i class="fas fa-plus me-2"></i>Thêm bệnh nhân
                </button>
            </div>

            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải dữ liệu...</p>
            </div>

            <div class="table-responsive" id="tableContainer">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th style="width: 20%;">Họ và tên</th>
                            <th style="width: 15%;">Ngày sinh</th>
                            <th style="width: 10%;">Giới tính</th>
                            <th style="width: 13%;">Điện thoại</th>
                            <th style="width: 17%;">BHYT</th>
                            <th style="width: 15%;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody"></tbody>
                </table>
            </div>

            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 bệnh nhân</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Add/Edit Patient Modal -->
    <div class="modal fade" id="patientModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm bệnh nhân</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="patientForm">
                        <input type="hidden" id="patientId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Tên bệnh nhân <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="patientName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="patientPhone" required pattern="[0-9]{10,11}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="patientEmail" required maxlength="100" placeholder="email@domain.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ngày sinh <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="patientBirthDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Giới tính <span class="text-danger">*</span></label>
                                <select class="form-select" id="patientGender" required>
                                    <option value="">-- Chọn giới tính --</option>
                                    <option value="nam">Nam</option>
                                    <option value="nu">Nữ</option>
                                    <option value="khac">Khác</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số thẻ BHYT</label>
                                <input type="text" class="form-control" id="patientBHYT" maxlength="15" placeholder="VD: DN1234567890123">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mật khẩu <span class="text-danger" id="passwordRequired">*</span></label>
                                <input type="password" class="form-control" id="password">
                                <small class="text-muted">Để trống nếu không muốn thay đổi (khi sửa)</small>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit mt-4">
                            <i class="fas fa-save me-2"></i>Lưu thông tin
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- View Patient Modal -->
    <div class="modal fade" id="viewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thông tin bệnh nhân</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewModalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/config-admin.js"></script>
    <script src="assets/js/sidebar-admin.js"></script>
    <script>
let currentPage = 1;
        const itemsPerPage = 10;
        let allPatients = [];
        let filteredPatients = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            loadPatients();
            document.getElementById('patientForm').addEventListener('submit', handleFormSubmit);
        });

        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE_ADMIN}/patient-stats.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                animateNumber('totalPatients', data.total || 0);
                animateNumber('maleCount', data.male || 0);
                animateNumber('femaleCount', data.female || 0);
                animateNumber('bhytCount', data.bhyt || 0);
            } catch (error) {
                console.error('Lỗi:', error);
                document.querySelectorAll('#totalPatients, #maleCount, #femaleCount, #bhytCount')
                    .forEach(el => el.textContent = 'Lỗi');
            }
        }

        async function loadPatients() {
            showLoading(true);
            
            try {
                const response = await fetch(`${API_BASE_ADMIN}/get-all-patients.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    allPatients = data.data;
                    filteredPatients = [...allPatients];
                    displayPatients();
                } else {
                    showAlert('error', data.message || 'Không thể tải dữ liệu');
                    handleSessionExpired(data.message || null);
                }
            } catch (error) {
                console.error('Error loading patients:', error);
                showAlert('error', 'Lỗi kết nối đến server');
                handleSessionExpired("fetch_failed");
            } finally {
                showLoading(false);
            }
        }

        function displayPatients() {
            const tbody = document.getElementById('patientTableBody');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredPatients.slice(start, end);
            
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5">Không có dữ liệu</td></tr>';
                return;
            }
            
            tbody.innerHTML = pageData.map(patient => {
                const genderClass = patient.gioiTinh === 'nam' ? 'male' : patient.gioiTinh === 'nu' ? 'female' : '';
                const genderLabel = patient.gioiTinh === 'nam' ? 'Nam' : patient.gioiTinh === 'nu' ? 'Nữ' : 'Khác';
                const age = patient.ngaySinh ? calculateAge(patient.ngaySinh) : 'N/A';
                
                return `
                    <tr>
                        <td>
                            <i class="fas fa-user-injured me-2 text-primary"></i>
                            ${patient.tenBenhNhan}
                        </td>
                        <td>${formatDate(patient.ngaySinh)} (${age} tuổi)</td>
                        <td><span class="gender-badge ${genderClass}">${genderLabel}</span></td>
                        <td>${patient.soDienThoai || 'N/A'}</td>
                        <td>
                            ${patient.soTheBHYT ? 
                                `<span class="bhyt-badge">${patient.soTheBHYT}</span>` : 
                                `<span class="no-bhyt">Chưa có</span>`
                            }
                        </td>
                        <td>
                            <button class="btn-action btn-view" onclick="viewPatient('${patient.maBenhNhan}')" title="Xem chi tiết">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn-action btn-edit" onclick="editPatient('${patient.maBenhNhan}')" title="Chỉnh sửa">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-action btn-delete" onclick="deletePatient('${patient.maBenhNhan}')" title="Xóa">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredPatients.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredPatients.length);
            
            document.getElementById('recordInfo').textContent = 
                `Hiển thị ${start} - ${end} của ${filteredPatients.length} bệnh nhân`;
            
            let html = `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            html += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `;
            
            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredPatients.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                displayPatients();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function applyFilters() {
            const gender = document.getElementById('filterGender').value;
            const bhyt = document.getElementById('filterBHYT').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            
            filteredPatients = allPatients.filter(patient => {
                let match = true;
                
                if (gender && patient.gioiTinh !== gender) match = false;
                if (bhyt === 'co' && !patient.soTheBHYT) match = false;
                if (bhyt === 'khong' && patient.soTheBHYT) match = false;
                if (search) {
                    const searchFields = `${patient.maBenhNhan || ''} ${patient.tenBenhNhan || ''} ${patient.soDienThoai || ''} ${patient.email || ''} ${patient.tenDangNhap || ''}`.toLowerCase();
                    if (!searchFields.includes(search)) match = false;
                }
                
                return match;
            });
            
            currentPage = 1;
            displayPatients();
        }

        function resetFilters() {
            document.getElementById('filterGender').value = '';
            document.getElementById('filterBHYT').value = '';
            document.getElementById('filterSearch').value = '';
            filteredPatients = [...allPatients];
            currentPage = 1;
            displayPatients();
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Thêm bệnh nhân mới';
            document.getElementById('patientForm').reset();
            document.getElementById('patientId').value = '';
            document.getElementById('password').required = true;
            document.getElementById('passwordRequired').textContent = '*';
            new bootstrap.Modal(document.getElementById('patientModal')).show();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('patientBirthDate').setAttribute('max', today);
        }

        async function editPatient(maBenhNhan) {
            const patient = allPatients.find(p => p.maBenhNhan === maBenhNhan);
            if (!patient) return;
            
            document.getElementById('modalTitle').textContent = 'Chỉnh sửa thông tin bệnh nhân';
            document.getElementById('patientId').value = maBenhNhan;
            document.getElementById('patientName').value = patient.tenBenhNhan;
            document.getElementById('patientPhone').value = patient.soDienThoai;
            document.getElementById('patientEmail').value = patient.email || '';
            document.getElementById('patientBirthDate').value = patient.ngaySinh;
            document.getElementById('patientGender').value = patient.gioiTinh;
            document.getElementById('patientBHYT').value = patient.soTheBHYT || '';
            document.getElementById('username').value = patient.tenDangNhap;
            document.getElementById('password').value = '';
            document.getElementById('password').required = false;
            document.getElementById('passwordRequired').textContent = '';
            
            new bootstrap.Modal(document.getElementById('patientModal')).show();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('patientBirthDate').setAttribute('max', today);
        }

        async function viewPatient(maBenhNhan) {
            const patient = allPatients.find(p => p.maBenhNhan === maBenhNhan);
            if (!patient) return;
            
            const age = calculateAge(patient.ngaySinh);
            const genderLabel = patient.gioiTinh === 'nam' ? 'Nam' : patient.gioiTinh === 'nu' ? 'Nữ' : 'Khác';
            const genderClass = patient.gioiTinh === 'nam' ? 'male' : patient.gioiTinh === 'nu' ? 'female' : '';
            const initials = patient.tenBenhNhan.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            
            const body = document.getElementById('viewModalBody');
            body.innerHTML = `
                <div class="patient-detail-card">
                    <div class="patient-detail-hero">
                        <div class="patient-detail-avatar">
                            ${initials || 'BN'}
                        </div>
                        <div>
                            <h5 class="patient-detail-name">${patient.tenBenhNhan}</h5>
                            <p class="patient-detail-code">Mã bệnh nhân: ${patient.maBenhNhan || 'N/A'}</p>
                            <span class="gender-badge ${genderClass}">${genderLabel}</span>
                        </div>
                    </div>
                    <div class="patient-detail-grid">
                        <div class="patient-detail-item">
                            <span class="patient-detail-label">Ngày sinh</span>
                            <span class="patient-detail-value">${formatDate(patient.ngaySinh)} (${age} tuổi)</span>
                        </div>
                        <div class="patient-detail-item">
                            <span class="patient-detail-label">Số điện thoại</span>
                            <span class="patient-detail-value">${patient.soDienThoai || 'Chưa cập nhật'}</span>
                        </div>
                        <div class="patient-detail-item">
                            <span class="patient-detail-label">Email</span>
                            <span class="patient-detail-value">${patient.email || 'Chưa cập nhật'}</span>
                        </div>
                        <div class="patient-detail-item">
                            <span class="patient-detail-label">BHYT</span>
                            <span class="patient-detail-value">${patient.soTheBHYT ? `<span class="bhyt-badge">${patient.soTheBHYT}</span>` : '<span class="no-bhyt">Chưa có</span>'}</span>
                        </div>
                        <div class="patient-detail-item">
                            <span class="patient-detail-label">Tên đăng nhập</span>
                            <span class="patient-detail-value">${patient.tenDangNhap || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `;
            
            new bootstrap.Modal(document.getElementById('viewModal')).show();
        }

        async function deletePatient(maBenhNhan) {
            if (!confirm('Bạn có chắc chắn muốn xóa bệnh nhân này? Hành động này không thể hoàn tác!')) return;
            
            try {
                const response = await fetch(`${API_BASE_ADMIN}/delete-patient.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ maBenhNhan: maBenhNhan })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('success', 'Xóa bệnh nhân thành công!');
                    loadPatients();
                    loadStatistics();
                } else {
                    showAlert('error', data.message || 'Không thể xóa bệnh nhân');
                }
            } catch (error) {
                console.error('Error deleting patient:', error);
                showAlert('error', 'Lỗi kết nối đến server');
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const maBenhNhan = document.getElementById('patientId').value;
            const data = {
                tenBenhNhan: document.getElementById('patientName').value,
                soDienThoai: document.getElementById('patientPhone').value,
                email: document.getElementById('patientEmail').value.trim(),
                ngaySinh: document.getElementById('patientBirthDate').value,
                gioiTinh: document.getElementById('patientGender').value,
                soTheBHYT: document.getElementById('patientBHYT').value || null,
                tenDangNhap: document.getElementById('username').value,
                matKhau: document.getElementById('password').value
            };
            
            if (maBenhNhan) data.maBenhNhan = maBenhNhan;
            
            try {
                const url = maBenhNhan ? `${API_BASE_ADMIN}/update-patient.php` : `${API_BASE_ADMIN}/create-patient.php`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', maBenhNhan ? 'Cập nhật thành công!' : 'Thêm bệnh nhân thành công!');
                    bootstrap.Modal.getInstance(document.getElementById('patientModal')).hide();
                    loadPatients();
                    loadStatistics();
                } else {
                    showAlert('error', result.message || 'Có lỗi xảy ra');
                }
            } catch (error) {
                console.error('Error saving patient:', error);
                showAlert('error', 'Lỗi kết nối đến server');
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN');
        }

        function calculateAge(birthDate) {
            if (!birthDate) return 'N/A';
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const monthDiff = today.getMonth() - birth.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                age--;
            }
            return age;
        }

        function scrollToSection(id) {
            document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
