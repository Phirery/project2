<!-- Mobile Overlay -->
<div class="mobile-overlay" id="mobileOverlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar" aria-label="Điều hướng cổng nhân viên">
    <div class="sidebar-header" onclick="window.location.href='index.html'">
        <h4><i class="fas fa-hospital-alt me-2"></i>Eden Staff</h4>
        <p>Cổng tác nghiệp nhân viên</p>
    </div>
    <ul class="sidebar-menu" id="staffSidebarMenu">
        <li class="sidebar-menu-loading" id="sidebarMenuLoading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Đang tải phân quyền...
        </li>

        <li class="user-logout-item" id="sidebarUserFooter">
            <div class="user-info-sidebar" onclick="window.location.href='tai-khoan-ca-nhan.html'">
                <div class="user-avatar" id="sidebarUserAvatar">NV</div>
                <div class="user-details">
                    <div class="user-name" id="sidebarUserName">Đang tải...</div>
                    <div class="user-role" id="sidebarUserRole">Nhân viên</div>
                </div>
            </div>
            <button type="button" class="logout-btn-sidebar" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
            </button>
        </li>
    </ul>
</aside>

<!-- Main Content Wrapper -->
<div class="main-content">
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-left">
            <h5 id="pageTitle"><i class="fas fa-chart-line me-2"></i>Dashboard</h5>
        </div>
        <div class="top-bar-right">
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Mở hoặc đóng menu điều hướng">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <div class="logout-header">
            <div class="user-avatar" id="topUserAvatar" onclick="window.location.href='tai-khoan-ca-nhan.html'" title="Tài khoản cá nhân">NV</div>
            <div class="user-details" onclick="window.location.href='tai-khoan-ca-nhan.html'">
                <div class="user-name" id="topUserName">Đang tải...</div>
                <div class="user-role" id="topUserRole">Nhân viên</div>
            </div>
            <button type="button" class="logout-btn-desktop" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
            </button>
        </div>
    </header>

    <!-- Content Area - This is where page content will go -->
    <main class="content-area" id="staffContentArea">
        <!-- Page specific content will be inserted here -->
    </main>
</div>

<!-- Scroll to Top Button -->
<button type="button" id="scrollTopBtn" aria-label="Cuộn lên đầu trang" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <i class="fas fa-chevron-up"></i>
</button>
