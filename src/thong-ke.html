<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-admin-css" rel="stylesheet" href="assets/css/sidebar-admin.css">
    <style>
        .filter-bar {
            background: white;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: #495057;
            white-space: nowrap;
        }

        .time-filter {
            display: flex;
            gap: 10px;
        }

        .time-btn {
            padding: 8px 20px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: #666;
        }

        .time-btn:hover {
            border-color: var(--primary-purple);
            color: var(--primary-purple);
        }

        .time-btn.active {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            border-color: transparent;
        }

        .export-btn {
            margin-left: auto;
            padding: 10px 25px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .chart-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chart-metric {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: #f3f6ff;
            border: 1px solid #dfe7ff;
            color: #495057;
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1;
            margin: 0;
        }

        .chart-metric.revenue {
            background: #ecfdf3;
            border-color: #c4f2d8;
            color: #1f7a3a;
        }

        .chart-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
            margin: 0;
            line-height: 1.2;
        }

        .chart-type-toggle {
            display: flex;
            gap: 5px;
            background: #f8f9fa;
            padding: 4px;
            border-radius: 8px;
        }

        .chart-type-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }

        .chart-type-btn:hover {
            background: rgba(102, 126, 234, 0.1);
            color: var(--primary-purple);
        }

        .chart-type-btn.active {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
        }

        .chart-full {
            grid-column: 1 / -1;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            margin-top: 25px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .custom-table {
            width: 100%;
        }

        .custom-table thead th {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            color: #495057;
            font-weight: 600;
            padding: 15px;
            border: none;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .custom-table tbody td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .custom-table tbody tr:hover {
            background: #f8fbff;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 0.3rem;
        }

        @media (max-width: 768px) {

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .time-filter {
                flex-wrap: wrap;
                gap: 8px;
            }

            .time-btn {
                padding: 8px 15px;
                font-size: 0.85rem;
            }

            .export-btn {
                margin-left: 0;
                width: 100%;
            }

            .chart-metric {
                font-size: 0.78rem;
            }

            .chart-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .chart-wrapper {
                height: 300px;
            }

            .table-container {
                padding: 15px;
            }

            .custom-table {
                font-size: 0.85rem;
            }

            .custom-table thead th,
            .custom-table tbody td {
                padding: 10px 8px;
            }

        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="filter-bar">
            <div class="filter-group">
                <label><i class="fas fa-calendar me-2"></i>Khoảng thời gian:</label>
                <div class="time-filter">
                    <button class="time-btn" onclick="changeTimeFilter('week')" id="btnWeek">Tuần này</button>
                    <button class="time-btn active" onclick="changeTimeFilter('month')" id="btnMonth">Tháng này</button>
                    <button class="time-btn" onclick="changeTimeFilter('year')" id="btnYear">Năm nay</button>
                    <button class="time-btn" onclick="changeTimeFilter('all')" id="btnAll">Toàn bộ</button>
                </div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-calendar-alt me-2"></i>Tùy chỉnh:</label>
                <input type="date" class="form-control" id="dateFrom" style="width: 150px;">
                <span>đến</span>
                <input type="date" class="form-control" id="dateTo" style="width: 150px;">
            </div>

            <button class="export-btn" onclick="exportReport()" style="display: none;">
                <i class="fas fa-file-export me-2"></i>Xuất báo cáo
            </button>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3">Đang tải dữ liệu thống kê...</p>
        </div>

        <div class="chart-row" id="chartsContainer">
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-title-wrap">
                        <h5 class="chart-title">Thống kê lịch khám</h5>
                        <span class="chart-metric" id="appointmentsHeaderMetric">0 lịch khám</span>
                    </div>
                    <div class="chart-type-toggle">
                        <button class="chart-type-btn active" onclick="changeChartType('appointments', 'bar')">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                        <button class="chart-type-btn" onclick="changeChartType('appointments', 'line')">
                            <i class="fas fa-chart-line"></i>
                        </button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="appointmentsChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-title-wrap">
                        <h5 class="chart-title">Thống kê bệnh nhân</h5>
                        <span class="chart-metric" id="patientsHeaderMetric">0 bệnh nhân</span>
                    </div>
                    <div class="chart-type-toggle">
                        <button class="chart-type-btn active" onclick="changeChartType('patients', 'line')">
                            <i class="fas fa-chart-line"></i>
                        </button>
                        <button class="chart-type-btn" onclick="changeChartType('patients', 'bar')">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="patientsChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-container">
                <div class="chart-header">
                    <h5 class="chart-title">Lịch khám theo khoa</h5>
                    <div class="chart-type-toggle">
                        <button class="chart-type-btn active" onclick="changeChartType('departments', 'doughnut')">
                            <i class="fas fa-chart-pie"></i>
                        </button>
                        <button class="chart-type-btn" onclick="changeChartType('departments', 'bar')">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="departmentsChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-header">
                    <h5 class="chart-title">Trạng thái lịch khám</h5>
                    <div class="chart-type-toggle">
                        <button class="chart-type-btn active" onclick="changeChartType('status', 'pie')">
                            <i class="fas fa-chart-pie"></i>
                        </button>
                        <button class="chart-type-btn" onclick="changeChartType('status', 'bar')">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-container chart-full">
                <div class="chart-header">
                    <div class="chart-title-wrap">
                        <h5 class="chart-title">Xu hướng doanh thu thực tế</h5>
                        <span class="chart-metric revenue" id="revenueActualHeaderMetric">0đ</span>
                    </div>
                    <div class="chart-type-toggle">
                        <button class="chart-type-btn active" onclick="changeChartType('revenueActual', 'line')">
                            <i class="fas fa-chart-line"></i>
                        </button>
                        <button class="chart-type-btn" onclick="changeChartType('revenueActual', 'bar')">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="revenueActualChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-row">
            <div class="chart-container chart-full">
                <div class="chart-header">
                    <div class="chart-title-wrap">
                        <h5 class="chart-title">Xu hướng doanh thu (ước tính)</h5>
                        <span class="chart-metric revenue" id="revenueEstimatedHeaderMetric">0đ</span>
                    </div>
                    <div class="chart-type-toggle">
                        <button class="chart-type-btn active" onclick="changeChartType('revenue', 'line')">
                            <i class="fas fa-chart-line"></i>
                        </button>
                        <button class="chart-type-btn" onclick="changeChartType('revenue', 'bar')">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </div>

        <div class="table-container" id="top10">
            <div class="table-header">
                <h5 class="chart-title">Top 10 bác sĩ có nhiều lịch khám nhất</h5>
            </div>
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Xếp hạng</th>
                            <th>Bác sĩ</th>
                            <th>Chuyên khoa</th>
                            <th class="text-center">Số lịch khám</th>
                            <th class="text-center">Đã hoàn thành</th>
                        </tr>
                    </thead>
                    <tbody id="topDoctorsTable"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/config-admin.js"></script>
    <script src="assets/js/sidebar-admin.js"></script>
    <script>
        let currentFilter = 'month';
        let charts = {};
        let statsData = null;

        document.addEventListener('DOMContentLoaded', function () {
            loadStatistics();
            document.getElementById('dateFrom').addEventListener('change', handleCustomDateFilterChange);
            document.getElementById('dateTo').addEventListener('change', handleCustomDateFilterChange);
            document.getElementById('dateFrom').addEventListener('input', handleCustomDateFilterChange);
            document.getElementById('dateTo').addEventListener('input', handleCustomDateFilterChange);
            // Mobile menu
            // Scroll to top
            // Auto refresh notification
        });

        function changeTimeFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn' + filter.charAt(0).toUpperCase() + filter.slice(1)).classList.add('active');
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            loadStatistics();
        }

        function handleCustomDateFilterChange() {
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            if (!dateFrom || !dateTo) {
                return;
            }

            if (dateFrom > dateTo) {
                showAlert('error', 'Ngày bắt đầu phải nhỏ hơn ngày kết thúc');
                return;
            }

            currentFilter = 'custom';
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            loadStatistics(dateFrom, dateTo);
        }

        async function loadStatistics(dateFrom = null, dateTo = null) {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('chartsContainer').style.display = 'none';

            try {
                let url = `${API_BASE_ADMIN}/statistics-data.php?filter=${currentFilter}`;
                if (dateFrom && dateTo) {
                    url += `&dateFrom=${dateFrom}&dateTo=${dateTo}`;
                }

                const response = await fetch(url, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    statsData = data.data;
                    updateHeaderMetrics(statsData.summary);
                    createCharts(statsData);
                    updateTopDoctorsTable(statsData.topDoctors);
                } else {
                    showAlert('error', 'Không thể tải dữ liệu: ' + data.message);
                    handleSessionExpired(data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('error', 'Lỗi kết nối đến server');
                handleSessionExpired("fetch_failed");
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('chartsContainer').style.display = 'grid';
            }
        }

        function updateHeaderMetrics(summary) {
            const appointmentsMetric = document.getElementById('appointmentsHeaderMetric');
            const patientsMetric = document.getElementById('patientsHeaderMetric');
            const revenueActualMetric = document.getElementById('revenueActualHeaderMetric');
            const revenueEstimatedMetric = document.getElementById('revenueEstimatedHeaderMetric');

            if (appointmentsMetric) {
                appointmentsMetric.textContent = `${(summary.appointments || 0).toLocaleString('vi-VN')} lịch khám`;
            }
            if (patientsMetric) {
                patientsMetric.textContent = `${(summary.patients || 0).toLocaleString('vi-VN')} bệnh nhân`;
            }
            if (revenueActualMetric) {
                revenueActualMetric.textContent = `${(summary.revenueActual || 0).toLocaleString('vi-VN')}đ`;
            }
            if (revenueEstimatedMetric) {
                revenueEstimatedMetric.textContent = `${(summary.revenueEstimated || 0).toLocaleString('vi-VN')}đ`;
            }
        }

        function createCharts(data) {
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });
            charts = {};

            createAppointmentsChart(data.appointmentsTrend);
            createPatientsChart(data.patientsTrend);
            createDepartmentsChart(data.departmentsData);
            createStatusChart(data.statusData);
            createRevenueChart(data.revenueTrend);
            createRevenueActualChart(data.revenueTrendActual);
        }

        function createAppointmentsChart(data) {
            const ctx = document.getElementById('appointmentsChart');
            charts.appointments = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Số lịch khám',
                        data: data.values,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function createPatientsChart(data) {
            const ctx = document.getElementById('patientsChart');
            charts.patients = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Bệnh nhân khám',
                        data: data.values,
                        borderColor: 'rgba(0, 174, 239, 1)',
                        backgroundColor: 'rgba(0, 174, 239, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function createDepartmentsChart(data) {
            const ctx = document.getElementById('departmentsChart');
            charts.departments = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Số lịch khám',
                        data: data.values,
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(0, 174, 239, 0.8)',
                            'rgba(40, 167, 69, 0.8)',
                            'rgba(255, 193, 7, 0.8)',
                            'rgba(220, 53, 69, 0.8)',
                            'rgba(23, 162, 184, 0.8)',
                            'rgba(108, 117, 125, 0.8)'
                        ],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right' } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function createStatusChart(data) {
            const ctx = document.getElementById('statusChart');
            charts.status = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Đã đặt', 'Chờ', 'Hoàn thành', 'Đã hủy'],
                    datasets: [{
                        data: [data.confirmed, data.pending, data.completed, data.cancelled],
                        backgroundColor: [
                            'rgba(0, 174, 239, 0.8)',
                            'rgba(255, 193, 7, 0.8)',
                            'rgba(40, 167, 69, 0.8)',
                            'rgba(220, 53, 69, 0.8)'
                        ],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function createRevenueChart(data) {
            const ctx = document.getElementById('revenueChart');
            charts.revenue = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Doanh thu ước tính (VNĐ)',
                        data: data.values,
                        borderColor: 'rgba(255, 193, 7, 1)',
                        backgroundColor: 'rgba(255, 193, 7, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, position: 'top' } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: function (value) { return Math.floor(value).toLocaleString('vi-VN') + 'đ'; } }
                        }
                    }
                }
            });
        }

        function createRevenueActualChart(data) {
            const ctx = document.getElementById('revenueActualChart');
            charts.revenueActual = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Doanh thu thực tế (VNĐ)',
                        data: data.values,
                        borderColor: 'rgba(40, 167, 69, 1)',
                        backgroundColor: 'rgba(40, 167, 69, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, position: 'top' } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: function (value) { return Math.floor(value).toLocaleString('vi-VN') + 'đ'; } }
                        }
                    }
                }
            });
        }

        function changeChartType(chartName, type) {
            if (!charts[chartName]) return;

            const container = charts[chartName].canvas.closest('.chart-container');
            container.querySelectorAll('.chart-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.chart-type-btn').classList.add('active');

            charts[chartName].config.type = type;

            if (chartName === 'departments') {
                charts[chartName].options.plugins.legend.display = true;
                charts[chartName].options.plugins.legend.position = type === 'bar' ? 'top' : 'right';
            }

            if (chartName === 'status') {
                charts[chartName].options.plugins.legend.display = true;
                charts[chartName].options.plugins.legend.position = type === 'bar' ? 'top' : 'bottom';
            }

            charts[chartName].update();
        }

        function updateTopDoctorsTable(doctors) {
            const tbody = document.getElementById('topDoctorsTable');

            if (!doctors || doctors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Chưa có dữ liệu</td></tr>';
                return;
            }

            tbody.innerHTML = doctors.map((doctor, index) => {
                const completionRate = doctor.total > 0 ? (doctor.completed / doctor.total * 100).toFixed(1) : 0;
                return `
                    <tr>
                        <td>
                            <strong style="font-size: 1.2rem; color: ${index < 3 ? 'var(--primary-purple)' : '#666'};">
                                #${index + 1}
                            </strong>
                        </td>
                        <td>
                            <strong>${doctor.tenBacSi}</strong>
                            <br><small class="text-muted">${doctor.maBacSi}</small>
                        </td>
                        <td>${doctor.tenChuyenKhoa || 'N/A'}</td>
                        <td class="text-center">
                            <strong style="color: var(--primary-purple);">${doctor.total}</strong>
                        </td>
                        <td class="text-center">
                            <strong style="color: #28a745;">${doctor.completed}</strong>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function exportReport() {
            const filterText = {
                'week': 'Tuần này',
                'month': 'Tháng này',
                'year': 'Năm nay',
                'all': 'Toàn bộ',
                'custom': 'Tùy chỉnh'
            }[currentFilter];

            const format = prompt('Chọn định dạng xuất:\n1. PDF\n2. Excel\n3. CSV\n\nNhập số (1-3):');

            if (!format) return;

            let endpoint = '';
            let filename = '';

            switch (format) {
                case '1':
                    endpoint = 'export-pdf.php';
                    filename = 'bao-cao-thong-ke.pdf';
                    break;
                case '2':
                    endpoint = 'export-excel.php';
                    filename = 'bao-cao-thong-ke.xlsx';
                    break;
                case '3':
                    endpoint = 'export-csv.php';
                    filename = 'bao-cao-thong-ke.csv';
                    break;
                default:
                    showAlert('error', 'Định dạng không hợp lệ!');
                    return;
            }

            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            let url = `${API_BASE_ADMIN}/${endpoint}?filter=${currentFilter}`;
            if (currentFilter === 'custom' && dateFrom && dateTo) {
                url += `&dateFrom=${dateFrom}&dateTo=${dateTo}`;
            }

            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showAlert('success', `Đang xuất báo cáo ${filterText} dạng ${format === '1' ? 'PDF' : format === '2' ? 'Excel' : 'CSV'}...`);
        }

        function scrollToSection(id) {
            document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>

</html>
