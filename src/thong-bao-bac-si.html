<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - Hệ thống Bác Sĩ</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-doctor-css" rel="stylesheet" href="assets/css/sidebar-doctor.css">
    <style>
        .summary-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #f8f9fb;
            border: 1px solid #e9ecef;
            color: #4c5665;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .summary-chip i {
            color: var(--primary-blue, #4A90E2);
        }

        .summary-chip strong {
            color: #1f2a37;
            font-size: 1rem;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .filter-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .search-box input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898aa;
        }

        .form-select {
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .form-select:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .notifications-container {
            margin: 20px 0;
        }

        .notification-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .notification-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .notification-item.unread {
            background: linear-gradient(to right, #eaf2fd 0%, #ffffff 100%);
            border-left: 4px solid #4A90E2;
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            right: 20px;
            top: 20px;
            width: 10px;
            height: 10px;
            background: #4A90E2;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .notification-type {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .notification-type.booking {
            background: #d4edda;
            color: #155724;
        }

        .notification-type.cancel {
            background: #f8d7da;
            color: #721c24;
        }

        .notification-type.password {
            background: #e8daef;
            color: #6c3483;
        }

        .notification-type.system {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .notification-time {
            color: #6c757d;
            font-size: 0.85rem;
        }

        .notification-content {
            margin: 10px 0;
        }

        .notification-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 1.05rem;
        }

        .notification-text {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .notification-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e9ecef;
        }

        .notification-detail {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .notification-detail i {
            color: #4A90E2;
        }

        .notification-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-notif-action {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-blue, #4A90E2);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-blue, #4A90E2);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-blue, #4A90E2);
            border-color: var(--primary-blue, #4A90E2);
        }

        @media (max-width: 768px) {
            .summary-chips { gap: 8px; margin-bottom: 15px; }

            .section-card {
                padding: 15px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .filter-bar {
                padding: 15px;
            }

            .notification-item {
                padding: 15px;
            }

            .notification-header {
                flex-direction: column;
                gap: 10px;
            }

            .notification-details {
                flex-direction: column;
                gap: 8px;
            }

            .pagination-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="summary-chips">
            <div class="summary-chip"><i class="fas fa-bell"></i>Tổng thông báo: <strong id="totalNotifications">0</strong></div>
            <div class="summary-chip"><i class="fas fa-envelope"></i>Chưa đọc: <strong id="unreadNotifications">0</strong></div>
            <div class="summary-chip"><i class="fas fa-calendar-plus"></i>Đặt lịch: <strong id="bookingNotifications">0</strong></div>
            <div class="summary-chip"><i class="fas fa-calendar-times"></i>Hủy lịch: <strong id="cancelNotifications">0</strong></div>
            <div class="summary-chip" style="display: none;"><i class="fas fa-key"></i>Cấp lại mật khẩu: <strong id="passwordNotifications">0</strong></div>
            <div class="summary-chip"><i class="fas fa-bell"></i>Cập nhật lịch biểu: <strong id="scheduleNotifications">0</strong></div>
        </div>

        <div class="section-card">
            <div class="card-header">
                <h5><i class="fas fa-list me-2"></i>Danh sách thông báo <span class="badge bg-primary"
                        id="totalDisplay">0</span></h5>
                <div class="header-actions">
                    <button class="btn btn-sm btn-outline-primary" onclick="markAllAsRead()"
                        title="Đánh dấu tất cả đã đọc"><i class="fas fa-check-double"></i></button>
                    <button class="sort-toggle-btn" id="sortToggleBtn" type="button" onclick="toggleSortOrder()" aria-label="Đổi thứ tự thời gian">
                        <i id="sortToggleIcon" class="fas fa-sort-amount-down"></i>
                    </button>
                </div>
            </div>
            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="search-box filter-control-wrap"><i class="fas fa-search"></i><input type="text" class="form-control"
                                id="searchInput" placeholder="Tìm kiếm thông báo..." oninput="applyFilters()"><button type="button" class="filter-clear-btn" id="clearSearchBtn" aria-label="Xóa từ khóa tìm kiếm" onclick="clearSearch()">×</button></div>
                    </div>
                    <div class="col-md-2"><select class="form-select" id="typeFilter" onchange="applyFilters()">
                            <option value="">Tất cả loại</option>
                            <option value="Đặt lịch">Đặt lịch</option>
                            <option value="Hủy lịch">Hủy lịch</option>
                            <option value="Cấp lại mật khẩu">Cấp lại mật khẩu</option>
                            <option value="Cập nhật lịch biểu">Cập nhật lịch biểu</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select" id="statusFilter" onchange="applyFilters()">
                            <option value="">Tất cả</option>
                            <option value="unread">Chưa đọc</option>
                            <option value="read">Đã đọc</option>
                        </select></div>
                </div>
            </div>
            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải...</p>
            </div>
            <div class="notifications-container" id="notificationsList"></div>
            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 thông báo</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <audio id="notificationSound" preload="auto">
        <source
            src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZUQ0PWqPm77BfGQg+ltv0yXMmBS17y/DajjkIGGC28OivVhELTKXi8bllHAU2jdXzzn0pBSh+zPDZizcIGWe56+mhTg4PWKLl8LViFgo7kt37xW8hBTCF0PPTgjQGH2++8OKaUg0RXbDp7qxXFApHoN/yv2wiBTSK0/PQgC0GJnrJ8N6MOwgZZbjt56xZEwxRp+Lxt2MbBjqQ1/LLeS0FKoHN8dqIOQcYa7rt5qBNDg9Vo+Twt2IZCDyU2vPFcSQFMYjR89OCMwYfa731+KdXFA1Uqufwsmgd"
            type="audio/wav">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/doctor-page-helper.js"></script>
    <script src="assets/js/sidebar-doctor.js"></script>

    <script>
        const API_BASE = window.DoctorPageHelper.doctorApiBase;

        let currentPage = 1;
        const itemsPerPage = 10;
        let currentNotifications = [];
        let totalNotificationsFiltered = 0;
        let currentStats = {
            totalNotifications: 0,
            unreadNotifications: 0,
            bookingNotifications: 0,
            cancelNotifications: 0,
            passwordNotifications: 0,
            scheduleNotifications: 0
        };
        let autoRefreshInterval;
        let lastNotificationCount = 0;
        let sortOrder = 'desc';

        document.addEventListener('DOMContentLoaded', function () {
            window.DoctorPageHelper.syncSearchClearButton('searchInput', 'clearSearchBtn');
            syncSortToggle();
            markPageAsViewed();
            loadNotifications();
            startAutoRefresh();

            window.addEventListener('beforeunload', () => { stopAutoRefresh(); });
        });

        async function markPageAsViewed() {
            try { await fetch(`${API_BASE}/mark-notifications-viewed.php`, { method: 'POST', credentials: 'include' }); }
            catch (error) { console.error('Error marking notifications as viewed:', error); }
        }

        function startAutoRefresh() { autoRefreshInterval = setInterval(() => { loadNotifications(true, currentPage); }, 5000); }
        function stopAutoRefresh() { if (autoRefreshInterval) clearInterval(autoRefreshInterval); }

        function buildNotificationsQuery(page = 1) {
            const params = new URLSearchParams();
            params.set('page', String(page));
            params.set('limit', String(itemsPerPage));

            const search = document.getElementById('searchInput')?.value?.trim() || '';
            const type = document.getElementById('typeFilter')?.value || '';
            const status = document.getElementById('statusFilter')?.value || '';
            params.set('order', sortOrder);

            if (search) params.set('search', search);
            if (type) params.set('type', type);
            if (status) params.set('status', status);

            return params.toString();
        }

        async function loadNotifications(silent = false, page = currentPage) {
            if (!silent) showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/get-notifications.php?${buildNotificationsQuery(page)}`, { credentials: 'include' });
                const data = await response.json();
                if (data.success) {
                    const unreadCount = Number(data.stats?.unreadNotifications || 0);
                    if (!silent && unreadCount > lastNotificationCount && lastNotificationCount > 0) playNotificationSound();
                    lastNotificationCount = unreadCount;

                    currentNotifications = data.data || [];
                    totalNotificationsFiltered = Number(data.pagination?.total || 0);
                    currentPage = Number(data.pagination?.page || page || 1);
                    currentStats = {
                        totalNotifications: Number(data.stats?.totalNotifications || 0),
                        unreadNotifications: unreadCount,
                        bookingNotifications: Number(data.stats?.bookingNotifications || 0),
                        cancelNotifications: Number(data.stats?.cancelNotifications || 0),
                        passwordNotifications: Number(data.stats?.passwordNotifications || 0),
                        scheduleNotifications: Number(data.stats?.scheduleNotifications || 0)
                    };

                    updateStatistics();
                    displayNotifications();
                } else {
                    if (!silent) { showError(data.message); handleSessionExpired(data.message); }
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                if (!silent) { showError('Lỗi kết nối server'); handleSessionExpired("fetch_failed"); }
            } finally { if (!silent) showLoading(false); }
        }

        function updateStatistics() {
            animateNumber('totalNotifications', currentStats.totalNotifications);
            animateNumber('unreadNotifications', currentStats.unreadNotifications);
            animateNumber('bookingNotifications', currentStats.bookingNotifications);
            animateNumber('cancelNotifications', currentStats.cancelNotifications);
            animateNumber('passwordNotifications', currentStats.passwordNotifications);
            animateNumber('scheduleNotifications', currentStats.scheduleNotifications);
        }

        function displayNotifications() {
            const container = document.getElementById('notificationsList');
            document.getElementById('totalDisplay').textContent = totalNotificationsFiltered;
            if (currentNotifications.length === 0) { container.innerHTML = '<div class="text-center py-5 text-muted"><i class="fas fa-inbox fa-3x mb-3"></i><p>Không có thông báo</p></div>'; updatePagination(); return; }
            container.innerHTML = currentNotifications.map(notif => {
                const isUnread = !notif.daXem;
                let typeClass, icon;
                if (notif.loai === 'Đặt lịch') { typeClass = 'booking'; icon = 'fa-calendar-plus'; }
                else if (notif.loai === 'Hủy lịch') { typeClass = 'cancel'; icon = 'fa-calendar-times'; }
                else if (notif.loai === 'Cấp lại mật khẩu') { typeClass = 'password'; icon = 'fa-key'; }
                else if (notif.loai === 'Cập nhật lịch biểu') { typeClass = 'system'; icon = 'fa-calendar-day'; }
                else { typeClass = 'booking'; icon = 'fa-bell'; }
                return `
                    <div class="notification-item ${isUnread ? 'unread' : ''}" onclick="markAsRead(${notif.maThongBao})">
                        <div class="notification-header">
                            <span class="notification-type ${typeClass}"><i class="fas ${icon}"></i> ${notif.loai}</span>
                            <span class="notification-time">${formatTimeAgo(notif.thoiGian)}</span>
                        </div>
                        <div class="notification-content">
                            <div class="notification-title">${notif.tieuDe}</div>
                            <div class="notification-text">${notif.noiDung}</div>
                        </div>
                        ${(notif.tenBenhNhan || notif.ngayKham || notif.tenCa) ? `
                        <div class="notification-details">
                            ${notif.tenBenhNhan ? `<div class="notification-detail"><i class="fas fa-user"></i><span>${notif.tenBenhNhan}</span></div>` : ''}
                            ${notif.ngayKham ? `<div class="notification-detail"><i class="fas fa-calendar"></i><span>${formatDate(notif.ngayKham)}</span></div>` : ''}
                            ${notif.tenCa ? `<div class="notification-detail"><i class="fas fa-clock"></i><span>${notif.tenCa}</span></div>` : ''}
                        </div>` : ''}
                        <div class="notification-actions" onclick="event.stopPropagation()">
                        </div>
                    </div>
                `;
            }).join('');
            updatePagination();
        }

        function updatePagination() {
            const totalPages = totalNotificationsFiltered > 0 ? Math.ceil(totalNotificationsFiltered / itemsPerPage) : 0;
            const container = document.getElementById('paginationContainer');
            if (totalNotificationsFiltered === 0) {
                document.getElementById('recordInfo').textContent = 'Hiển thị 0 - 0 của 0 thông báo';
                container.innerHTML = '';
                return;
            }

            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, totalNotificationsFiltered);
            document.getElementById('recordInfo').textContent = `Hiển thị ${start} - ${end} của ${totalNotificationsFiltered} thông báo`;
            let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;"><i class="fas fa-chevron-left"></i></a></li>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
                else if (i === currentPage - 2 || i === currentPage + 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;"><i class="fas fa-chevron-right"></i></a></li>`;
            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = totalNotificationsFiltered > 0 ? Math.ceil(totalNotificationsFiltered / itemsPerPage) : 0;
            if (page >= 1 && page <= totalPages) {
                loadNotifications(false, page);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function applyFilters() {
            currentPage = 1;
            window.DoctorPageHelper.syncSearchClearButton('searchInput', 'clearSearchBtn');
            loadNotifications(false, 1);
        }

        function clearSearch() {
            window.DoctorPageHelper.clearSearchInput('searchInput', 'clearSearchBtn', 'applyFilters');
        }

        async function markAsRead(maThongBao) {
            try {
                await fetch(`${API_BASE}/mark-notification-read.php`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ maThongBao }) });
                loadNotifications(true, currentPage);
            } catch (error) { console.error('Error marking as read:', error); }
        }

        async function markAllAsRead() {
            if (!confirm('Đánh dấu tất cả thông báo là đã đọc?')) return;
            try {
                const response = await fetch(`${API_BASE}/mark-all-notifications-read.php`, { method: 'POST', credentials: 'include' });
                const data = await response.json();
                if (data.success) { showAlert('success', 'Đã đánh dấu tất cả đã đọc!'); loadNotifications(); }
                else { showAlert('error', data.message || 'Không thể thực hiện'); }
            } catch (error) { console.error('Error:', error); showAlert('error', 'Lỗi kết nối server'); }
        }

        function toggleSortOrder() {
            sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
            syncSortToggle();
            loadNotifications(false, currentPage);
        }

        function syncSortToggle() {
            const btn = document.getElementById('sortToggleBtn');
            const icon = document.getElementById('sortToggleIcon');
            if (!btn || !icon) return;
            const isDesc = sortOrder === 'desc';
            icon.className = `fas ${isDesc ? 'fa-sort-amount-down' : 'fa-sort-amount-up'}`;
            btn.title = isDesc ? 'Đang sắp xếp: mới nhất trước' : 'Đang sắp xếp: cũ nhất trước';
        }

        function formatTimeAgo(dateStr) {
            const date = new Date(dateStr); const now = new Date(); const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000); const diffHours = Math.floor(diffMins / 60); const diffDays = Math.floor(diffHours / 24);
            if (diffMins < 1) return 'Vừa xong'; if (diffMins < 60) return `${diffMins} phút trước`; if (diffHours < 24) return `${diffHours} giờ trước`; if (diffDays < 7) return `${diffDays} ngày trước`;
            return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function formatDate(dateStr) { if (!dateStr) return ''; const date = new Date(dateStr); return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
        function playNotificationSound() { const sound = document.getElementById('notificationSound'); sound.play().catch(e => console.log('Sound play failed:', e)); }

        function animateNumber(elementId, targetNumber) {
            const element = document.getElementById(elementId);
            let currentNumber = parseInt(element.textContent) || 0;
            if (currentNumber === targetNumber) return;
            const increment = targetNumber > currentNumber ? 1 : -1;
            const duration = 500; const steps = Math.abs(targetNumber - currentNumber); const stepTime = steps > 0 ? duration / steps : 0;
            const timer = setInterval(() => { currentNumber += increment; element.textContent = currentNumber; if (currentNumber === targetNumber) clearInterval(timer); }, stepTime);
        }

        function showLoading(show) { document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none'; document.getElementById('notificationsList').style.display = show ? 'none' : 'block'; }
        function showError(message) { document.getElementById('notificationsList').innerHTML = `<div class="text-center py-5 text-danger"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i><p>${message}</p></div>`; }
    </script>
</body>

</html>
