<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - Hệ thống Bác Sĩ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link id="sidebar-doctor-css" rel="stylesheet" href="assets/css/sidebar-doctor.css">
    <style>
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            border-radius: 0 0 0 100%;
            opacity: 0.1;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.2);
        }

        .stat-card.total::before {
            background: #3498db;
        }

        .stat-card.pending::before {
            background: #f39c12;
        }

        .stat-card.completed::before {
            background: #2ecc71;
        }

        .stat-card.cancelled::before {
            background: #e74c3c;
        }

        .stat-card.password::before {
            background: #9b59b6;
        }

        .stat-card.total::after {
            background: #3498db;
        }

        .stat-card.pending::after {
            background: #f39c12;
        }

        .stat-card.completed::after {
            background: #2ecc71;
        }

        .stat-card.cancelled::after {
            background: #e74c3c;
        }

        .stat-card.password::after {
            background: #9b59b6;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            margin: 0 0 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.1), rgba(82, 196, 26, 0.1));
            color: var(--primary-blue, #4A90E2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.95rem;
        }

        .section-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-header h5 {
            color: #333;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .filter-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 40px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .search-box input:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8898aa;
        }

        .form-select {
            border-radius: 8px;
            border: 1px solid #e9ecef;
            height: 42px;
        }

        .form-select:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .notifications-container {
            margin: 20px 0;
        }

        .notification-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .notification-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .notification-item.unread {
            background: linear-gradient(to right, #eaf2fd 0%, #ffffff 100%);
            border-left: 4px solid #4A90E2;
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            right: 20px;
            top: 20px;
            width: 10px;
            height: 10px;
            background: #4A90E2;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .notification-type {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .notification-type.booking {
            background: #d4edda;
            color: #155724;
        }

        .notification-type.cancel {
            background: #f8d7da;
            color: #721c24;
        }

        .notification-type.password {
            background: #e8daef;
            color: #6c3483;
        }

        .notification-time {
            color: #6c757d;
            font-size: 0.85rem;
        }

        .notification-content {
            margin: 10px 0;
        }

        .notification-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 1.05rem;
        }

        .notification-text {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .notification-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e9ecef;
        }

        .notification-detail {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .notification-detail i {
            color: #4A90E2;
        }

        .notification-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-notif-action {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .pagination {
            margin: 0;
        }

        .page-link {
            color: var(--primary-blue, #4A90E2);
            border: 1px solid #dee2e6;
            margin: 0 3px;
            border-radius: 6px;
        }

        .page-link:hover {
            background: var(--primary-blue, #4A90E2);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--primary-blue, #4A90E2);
            border-color: var(--primary-blue, #4A90E2);
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .section-card {
                padding: 15px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .filter-bar {
                padding: 15px;
            }

            .notification-item {
                padding: 15px;
            }

            .notification-header {
                flex-direction: column;
                gap: 10px;
            }

            .notification-details {
                flex-direction: column;
                gap: 8px;
            }

            .pagination-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>

    <div id="page-content" style="display:none;">
        <div class="stats-row">
            <div class="stat-card total">
                <div class="stat-icon"><i class="fas fa-bell"></i></div>
                <div class="stat-number" id="totalNotifications">0</div>
                <div class="stat-label">Tổng thông báo</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-icon"><i class="fas fa-envelope"></i></div>
                <div class="stat-number" id="unreadNotifications">0</div>
                <div class="stat-label">Chưa đọc</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-icon"><i class="fas fa-calendar-plus"></i></div>
                <div class="stat-number" id="bookingNotifications">0</div>
                <div class="stat-label">Đặt lịch</div>
            </div>
            <div class="stat-card cancelled">
                <div class="stat-icon"><i class="fas fa-calendar-times"></i></div>
                <div class="stat-number" id="cancelNotifications">0</div>
                <div class="stat-label">Hủy lịch</div>
            </div>
            <div class="stat-card password" style="display: none;">
                <div class="stat-icon"><i class="fas fa-key"></i></div>
                <div class="stat-number" id="passwordNotifications">0</div>
                <div class="stat-label">Cấp lại mật khẩu</div>
            </div>
        </div>

        <div class="section-card">
            <div class="card-header">
                <h5><i class="fas fa-list me-2"></i>Danh sách thông báo <span class="badge bg-primary"
                        id="totalDisplay">0</span></h5>
                <div class="header-actions">
                    <button class="btn btn-sm btn-outline-primary" onclick="markAllAsRead()"
                        title="Đánh dấu tất cả đã đọc"><i class="fas fa-check-double"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteAllRead()" title="Xóa đã đọc"><i
                            class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box"><i class="fas fa-search"></i><input type="text" class="form-control"
                                id="searchInput" placeholder="Tìm kiếm thông báo..." oninput="applyFilters()"></div>
                    </div>
                    <div class="col-md-3"><select class="form-select" id="typeFilter" onchange="applyFilters()">
                            <option value="">Tất cả loại</option>
                            <option value="Đặt lịch">Đặt lịch</option>
                            <option value="Hủy lịch">Hủy lịch</option>
                            <option value="Cấp lại mật khẩu">Cấp lại mật khẩu</option>
                        </select></div>
                    <div class="col-md-2"><select class="form-select" id="statusFilter" onchange="applyFilters()">
                            <option value="">Tất cả</option>
                            <option value="unread">Chưa đọc</option>
                            <option value="read">Đã đọc</option>
                        </select></div>
                    <div class="col-md-3"><button class="btn btn-secondary w-100" onclick="resetFilters()"><i
                                class="fas fa-redo me-1"></i>Đặt lại</button></div>
                </div>
            </div>
            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p class="mt-3">Đang tải...</p>
            </div>
            <div class="notifications-container" id="notificationsList"></div>
            <div class="pagination-container">
                <div class="text-muted" id="recordInfo">Hiển thị 0 - 0 của 0 thông báo</div>
                <nav>
                    <ul class="pagination" id="paginationContainer"></ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>

    <script>
        const COMPONENT_PATH = 'components/';
        const API_BASE_DOCTOR = window.API_ENDPOINTS.doctor;
        const API_BASE_AUTH = window.API_ENDPOINTS.auth;
        var DOCTOR_INFO = {};
    </script>

    <script>
        const API_BASE = window.API_ENDPOINTS.doctor;

        let currentPage = 1;
        const itemsPerPage = 10;
        let allNotifications = [];
        let filteredNotifications = [];
        let autoRefreshInterval;
        let lastNotificationCount = 0;

        document.addEventListener('DOMContentLoaded', function () {
            markPageAsViewed();
            loadNotifications();
            startAutoRefresh();

            window.addEventListener('beforeunload', () => { stopAutoRefresh(); });
        });

        async function markPageAsViewed() {
            try { await fetch(`${API_BASE}/mark-notifications-viewed.php`, { method: 'POST', credentials: 'include' }); }
            catch (error) { console.error('Error marking notifications as viewed:', error); }
        }

        function startAutoRefresh() { autoRefreshInterval = setInterval(() => { loadNotifications(true); }, 5000); }
        function stopAutoRefresh() { if (autoRefreshInterval) clearInterval(autoRefreshInterval); }

        async function loadNotifications(silent = false) {
            if (!silent) showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/get-notifications.php`, { credentials: 'include' });
                const data = await response.json();
                if (data.success) {
                    const newCount = data.data.filter(n => !n.daXem).length;
                    if (!silent && newCount > lastNotificationCount && lastNotificationCount > 0) playNotificationSound();
                    lastNotificationCount = newCount;
                    allNotifications = data.data;
                    filteredNotifications = [...allNotifications];
                    updateStatistics();
                    displayNotifications();
                } else {
                    if (!silent) { showError(data.message); handleSessionExpired(data.message); }
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                if (!silent) { showError('Lỗi kết nối server'); handleSessionExpired("fetch_failed"); }
            } finally { if (!silent) showLoading(false); }
        }

        function updateStatistics() {
            const total = allNotifications.length;
            const unread = allNotifications.filter(n => !n.daXem).length;
            const booking = allNotifications.filter(n => n.loai === 'Đặt lịch').length;
            const cancel = allNotifications.filter(n => n.loai === 'Hủy lịch').length;
            const password = allNotifications.filter(n => n.loai === 'Cấp lại mật khẩu').length;
            animateNumber('totalNotifications', total);
            animateNumber('unreadNotifications', unread);
            animateNumber('bookingNotifications', booking);
            animateNumber('cancelNotifications', cancel);
            animateNumber('passwordNotifications', password);
        }

        function displayNotifications() {
            const container = document.getElementById('notificationsList');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredNotifications.slice(start, end);
            document.getElementById('totalDisplay').textContent = filteredNotifications.length;
            if (pageData.length === 0) { container.innerHTML = '<div class="text-center py-5 text-muted"><i class="fas fa-inbox fa-3x mb-3"></i><p>Không có thông báo</p></div>'; updatePagination(); return; }
            container.innerHTML = pageData.map(notif => {
                const isUnread = !notif.daXem;
                let typeClass, icon;
                if (notif.loai === 'Đặt lịch') { typeClass = 'booking'; icon = 'fa-calendar-plus'; }
                else if (notif.loai === 'Hủy lịch') { typeClass = 'cancel'; icon = 'fa-calendar-times'; }
                else if (notif.loai === 'Cấp lại mật khẩu') { typeClass = 'password'; icon = 'fa-key'; }
                else { typeClass = 'booking'; icon = 'fa-bell'; }
                return `
                    <div class="notification-item ${isUnread ? 'unread' : ''}" onclick="markAsRead(${notif.maThongBao})">
                        <div class="notification-header">
                            <span class="notification-type ${typeClass}"><i class="fas ${icon}"></i> ${notif.loai}</span>
                            <span class="notification-time">${formatTimeAgo(notif.thoiGian)}</span>
                        </div>
                        <div class="notification-content">
                            <div class="notification-title">${notif.tieuDe}</div>
                            <div class="notification-text">${notif.noiDung}</div>
                        </div>
                        ${(notif.tenBenhNhan || notif.ngayKham || notif.tenCa) ? `
                        <div class="notification-details">
                            ${notif.tenBenhNhan ? `<div class="notification-detail"><i class="fas fa-user"></i><span>${notif.tenBenhNhan}</span></div>` : ''}
                            ${notif.ngayKham ? `<div class="notification-detail"><i class="fas fa-calendar"></i><span>${formatDate(notif.ngayKham)}</span></div>` : ''}
                            ${notif.tenCa ? `<div class="notification-detail"><i class="fas fa-clock"></i><span>${notif.tenCa}</span></div>` : ''}
                        </div>` : ''}
                        <div class="notification-actions" onclick="event.stopPropagation()">
                            <button class="btn-notif-action btn-delete" onclick="deleteNotification(${notif.maThongBao})"><i class="fas fa-trash"></i> Xóa</button>
                        </div>
                    </div>
                `;
            }).join('');
            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredNotifications.length / itemsPerPage);
            const container = document.getElementById('paginationContainer');
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, filteredNotifications.length);
            document.getElementById('recordInfo').textContent = `Hiển thị ${start} - ${end} của ${filteredNotifications.length} thông báo`;
            let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;"><i class="fas fa-chevron-left"></i></a></li>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
                else if (i === currentPage - 2 || i === currentPage + 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;"><i class="fas fa-chevron-right"></i></a></li>`;
            container.innerHTML = html;
        }

        function changePage(page) { const totalPages = Math.ceil(filteredNotifications.length / itemsPerPage); if (page >= 1 && page <= totalPages) { currentPage = page; displayNotifications(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            const status = document.getElementById('statusFilter').value;
            filteredNotifications = allNotifications.filter(notif => {
                let match = true;
                if (search && !(notif.tieuDe.toLowerCase().includes(search) || notif.noiDung.toLowerCase().includes(search) || (notif.tenBenhNhan && notif.tenBenhNhan.toLowerCase().includes(search)))) match = false;
                if (type && notif.loai !== type) match = false;
                if (status === 'unread' && notif.daXem) match = false;
                if (status === 'read' && !notif.daXem) match = false;
                return match;
            });
            currentPage = 1; displayNotifications();
        }

        function resetFilters() { document.getElementById('searchInput').value = ''; document.getElementById('typeFilter').value = ''; document.getElementById('statusFilter').value = ''; filteredNotifications = [...allNotifications]; currentPage = 1; displayNotifications(); }

        async function markAsRead(maThongBao) {
            try {
                await fetch(`${API_BASE}/mark-notification-read.php`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ maThongBao }) });
                const notification = allNotifications.find(n => n.maThongBao === maThongBao);
                if (notification && !notification.daXem) { notification.daXem = true; updateStatistics(); displayNotifications(); }
            } catch (error) { console.error('Error marking as read:', error); }
        }

        async function markAllAsRead() {
            if (!confirm('Đánh dấu tất cả thông báo là đã đọc?')) return;
            try {
                const response = await fetch(`${API_BASE}/mark-all-notifications-read.php`, { method: 'POST', credentials: 'include' });
                const data = await response.json();
                if (data.success) { showAlert('success', 'Đã đánh dấu tất cả đã đọc!'); loadNotifications(); }
                else { showAlert('error', data.message || 'Không thể thực hiện'); }
            } catch (error) { console.error('Error:', error); showAlert('error', 'Lỗi kết nối server'); }
        }

        async function deleteNotification(maThongBao) {
            if (!confirm('Bạn có chắc muốn xóa thông báo này?')) return;
            try {
                const response = await fetch(`${API_BASE}/delete-notification.php`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ maThongBao }) });
                const data = await response.json();
                if (data.success) { showAlert('success', 'Đã xóa thông báo!'); loadNotifications(); }
                else { showAlert('error', data.message || 'Không thể xóa'); }
            } catch (error) { console.error('Error:', error); showAlert('error', 'Lỗi kết nối server'); }
        }

        async function deleteAllRead() {
            if (!confirm('Bạn có chắc muốn xóa tất cả thông báo đã đọc?')) return;
            try {
                const response = await fetch(`${API_BASE}/delete-read-notifications.php`, { method: 'POST', credentials: 'include' });
                const data = await response.json();
                if (data.success) { showAlert('success', `Đã xóa ${data.deleted} thông báo!`); loadNotifications(); }
                else { showAlert('error', data.message || 'Không thể xóa'); }
            } catch (error) { console.error('Error:', error); showAlert('error', 'Lỗi kết nối server'); }
        }

        function formatTimeAgo(dateStr) {
            const date = new Date(dateStr); const now = new Date(); const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000); const diffHours = Math.floor(diffMins / 60); const diffDays = Math.floor(diffHours / 24);
            if (diffMins < 1) return 'Vừa xong'; if (diffMins < 60) return `${diffMins} phút trước`; if (diffHours < 24) return `${diffHours} giờ trước`; if (diffDays < 7) return `${diffDays} ngày trước`;
            return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function formatDate(dateStr) { if (!dateStr) return ''; const date = new Date(dateStr); return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
        function playNotificationSound() { const sound = document.getElementById('notificationSound'); sound.play().catch(e => console.log('Sound play failed:', e)); }

        function animateNumber(elementId, targetNumber) {
            const element = document.getElementById(elementId);
            let currentNumber = parseInt(element.textContent) || 0;
            if (currentNumber === targetNumber) return;
            const increment = targetNumber > currentNumber ? 1 : -1;
            const duration = 500; const steps = Math.abs(targetNumber - currentNumber); const stepTime = steps > 0 ? duration / steps : 0;
            const timer = setInterval(() => { currentNumber += increment; element.textContent = currentNumber; if (currentNumber === targetNumber) clearInterval(timer); }, stepTime);
        }

        function showLoading(show) { document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none'; document.getElementById('notificationsList').style.display = show ? 'none' : 'block'; }
        function showError(message) { document.getElementById('notificationsList').innerHTML = `<div class="text-center py-5 text-danger"><i class="fas fa-exclamation-triangle fa-3x mb-3"></i><p>${message}</p></div>`; }
    </script>
</body>
