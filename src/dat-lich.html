<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Khám - Eden Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/common.css">

    <style>
        :root {
            --primary-blue: #4A90E2;
            --secondary-green: #52c41a;
            --primary-blue-rgb: 74, 144, 226;
            --secondary-green-rgb: 82, 196, 26;
            --primary-purple: var(--primary-blue);
            --secondary-purple: var(--secondary-green);
            --step-circle-size: 42px;
            --surface-soft: #f4f9ff;
            --surface-green: #f3fbef;
            --border-soft: #d8e6f5;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        /* Giữ nguyên background của trang */
        body {
            background: var(--primary-blue);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 20px;
        }

        /* Booking Container */
        .booking-wrapper {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1; /* Đảm bảo nằm trên các phần tử nền nếu có */
        }

        .booking-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(30, 41, 59, 0.18);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .booking-header {
            background: var(--primary-blue);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .booking-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
        }

        .booking-body {
            padding: 40px;
        }

        /* Step Indicator */
        .step-progress-wrapper {
            margin-bottom: 40px;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            position: relative;
            gap: 10px;
        }

        .step-indicator::before {
            content: "";
            position: absolute;
            top: calc(var(--step-circle-size) / 2);
            left: 0;
            right: 0;
            height: 4px;
            border-radius: 999px;
            background: #d7e3f1;
            transform: translateY(-50%);
            z-index: 0;
        }

        .progress-line {
            position: absolute;
            top: calc(var(--step-circle-size) / 2);
            left: 0;
            width: 0;
            height: 4px;
            border-radius: 999px;
            background: var(--secondary-green);
            transform: translateY(-50%);
            transition: left 0.3s ease, width 0.3s ease;
            z-index: 1;
        }

        .step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .step-circle {
            width: var(--step-circle-size);
            height: var(--step-circle-size);
            border-radius: 50%;
            background: #edf3f9;
            color: #8aa0b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-bottom: 8px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .step.active .step-circle,
        .step.completed .step-circle {
            background: var(--secondary-green);
            color: white;
            box-shadow: 0 6px 18px rgba(var(--primary-blue-rgb), 0.28);
        }

        .step-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.35;
        }

        .step.active .step-label,
        .step.completed .step-label {
            color: var(--primary-blue);
            font-weight: 600;
        }

        /* Section */
        .section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--primary-blue);
            display: inline-block;
        }

        /* Selection Grid */
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .selection-card {
            border: 2px solid var(--border-soft);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, var(--surface-soft) 100%);
            position: relative;
        }

        .selection-card:hover {
            border-color: var(--primary-blue);
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(var(--primary-blue-rgb), 0.16);
        }

        .selection-card.selected {
            border-color: var(--primary-blue);
            background: linear-gradient(135deg, rgba(var(--primary-blue-rgb), 0.14));
            box-shadow: 0 12px 28px rgba(var(--primary-blue-rgb), 0.24);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 16px;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .check-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--secondary-green);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .selection-card.selected .check-icon {
            display: flex;
        }

        /* Doctor Grid */
        .doctor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .doctor-card {
            border: 2px solid var(--border-soft);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(180deg, #ffffff 0%, var(--surface-soft) 100%);
        }

        .doctor-card:hover {
            border-color: var(--primary-blue);
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(var(--primary-blue-rgb), 0.16);
        }

        .doctor-card.selected {
            border-color: var(--primary-blue);
            background: linear-gradient(135deg, rgba(var(--primary-blue-rgb), 0.14));
            box-shadow: 0 12px 28px rgba(var(--primary-blue-rgb), 0.24);
        }

        .doctor-card.disabled {
            background: #f8fbfe;
            border-color: #dde7f0;
        }

        .doctor-card.disabled:hover {
            transform: none;
            box-shadow: none;
            border-color: #dde7f0;
        }

        .doctor-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .doctor-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 12px;
        }

        .doctor-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-dark);
        }

        .doctor-specialty {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Time Slots */
        .shift-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .shift-btn {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--border-soft);
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-align: center;
        }

        .shift-btn:hover {
            border-color: var(--primary-blue);
            background: rgba(var(--primary-blue-rgb), 0.06);
        }

        .shift-btn.selected {
            border-color: var(--primary-blue);
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 10px 22px rgba(var(--primary-blue-rgb), 0.2);
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .time-slot {
            border: 2px solid var(--border-soft);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-weight: 600;
            color: var(--text-dark);
        }

        .time-slot:hover:not(.disabled) {
            border-color: var(--primary-blue);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(var(--primary-blue-rgb), 0.14);
        }

        .time-slot.selected {
            border-color: var(--primary-blue);
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 10px 20px rgba(var(--primary-blue-rgb), 0.22);
        }

        .time-slot.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f5f7fa;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 16px;
        }

        .btn-custom {
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-prev {
            background: #eaf1f7;
            color: #486581;
        }

        .btn-prev:hover {
            background: #dbe7f1;
        }

        .btn-next, .btn-submit {
            background: var(--secondary-green);
            color: white;
        }

        .btn-next:hover, .btn-submit:hover {
            box-shadow: 0 10px 24px rgba(var(--primary-blue-rgb), 0.3);
            transform: translateY(-2px);
        }

        .btn-next:disabled, .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Summary */
        .summary-card {
            background: linear-gradient(135deg, rgba(var(--primary-blue-rgb), 0.12), rgba(var(--secondary-green-rgb), 0.1));
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(var(--primary-blue-rgb), 0.12);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            gap: 16px;
            border-bottom: 1px solid rgba(var(--primary-blue-rgb), 0.15);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-weight: 600;
            color: var(--text-muted);
        }

        .summary-value {
            font-weight: 700;
            color: var(--text-dark);
            text-align: right;
        }

        .form-control {
            border: 2px solid var(--border-soft);
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(var(--primary-blue-rgb), 0.12);
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner-border {
            color: var(--primary-blue);
        }

        @media (max-width: 768px) {
            :root {
                --step-circle-size: 36px;
            }

            .booking-wrapper {
                margin: 18px auto;
                padding: 0 12px;
            }

            .booking-card {
                border-radius: 20px;
            }

            .booking-header {
                padding: 28px 20px;
            }

            .booking-header h1 {
                font-size: 1.5rem;
            }

            .booking-header p {
                font-size: 0.95rem;
                margin-top: 10px;
                margin-bottom: 0;
            }

            .booking-body {
                padding: 22px 16px 24px;
            }

            .step-progress-wrapper {
                overflow-x: auto;
                margin: 0 -4px 28px;
                padding: 0 4px 10px;
                scrollbar-width: none;
            }

            .step-progress-wrapper::-webkit-scrollbar,
            .selection-grid::-webkit-scrollbar,
            .doctor-grid::-webkit-scrollbar,
            .shift-selector::-webkit-scrollbar,
            .time-slots::-webkit-scrollbar {
                display: none;
            }

            .step-indicator {
                min-width: 690px;
                gap: 0;
            }

            .step {
                min-width: 110px;
            }

            .step-label {
                font-size: 0.78rem;
                padding: 0 6px;
            }

            .section-title {
                font-size: 1.15rem;
                margin-bottom: 16px;
            }

            .selection-grid,
            .doctor-grid,
            .time-slots {
                display: grid;
                grid-auto-flow: column;
                overflow-x: auto;
                overflow-y: hidden;
                align-items: stretch;
                padding-bottom: 8px;
                margin-bottom: 24px;
                scrollbar-width: none;
            }

            .selection-grid {
                grid-template-columns: none;
                grid-auto-columns: minmax(155px, 170px);
                gap: 12px;
            }

            .doctor-grid {
                grid-template-columns: none;
                grid-auto-columns: minmax(230px, 250px);
                gap: 12px;
            }

            .shift-selector {
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: minmax(145px, 165px);
                overflow-x: auto;
                overflow-y: hidden;
                gap: 10px;
                margin-bottom: 18px;
                padding-bottom: 8px;
                scrollbar-width: none;
            }

            .time-slots {
                grid-template-columns: none;
                grid-auto-columns: minmax(115px, 128px);
                gap: 10px;
            }

            .selection-card,
            .doctor-card,
            .shift-btn,
            .time-slot {
                padding: 14px 12px;
                border-radius: 14px;
            }

            .selection-card {
                min-height: 160px;
            }

            .doctor-card {
                min-height: 108px;
            }

            .card-icon {
                width: 48px;
                height: 48px;
                margin-bottom: 12px;
                font-size: 1.4rem;
            }

            .card-title {
                font-size: 0.98rem;
            }

            .card-subtitle,
            .doctor-specialty,
            .shift-btn small {
                font-size: 0.78rem;
            }

            .check-icon {
                width: 24px;
                height: 24px;
                top: 10px;
                right: 10px;
                font-size: 0.75rem;
            }

            .doctor-header {
                margin-bottom: 8px;
            }

            .doctor-avatar {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
                margin-right: 10px;
            }

            .doctor-name {
                font-size: 0.95rem;
            }

            .shift-btn,
            .time-slot {
                min-height: 86px;
                font-size: 0.9rem;
            }

            .time-slot {
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 4px;
            }

            .nav-buttons {
                margin-top: 24px;
                flex-direction: column-reverse;
            }

            .btn-custom {
                width: 100%;
                justify-content: center;
                padding: 12px 18px;
                font-size: 0.95rem;
            }

            .summary-card {
                padding: 18px;
                margin-bottom: 22px;
            }

            .summary-item {
                padding: 10px 0;
                align-items: flex-start;
            }

            .summary-value {
                max-width: 58%;
                font-size: 0.95rem;
            }

            .empty-state {
                padding: 28px 16px;
            }
        }
    </style>
</head>
<body>
    <div id="pageLoader" style="
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: white;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    </div>

    <div id="header-placeholder" class="sticky-top" style="z-index: 1020;"></div>

    <div class="breadcrumb-section">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="index.html"><i class="fas fa-home"></i> Trang chủ</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Đặt lịch khám
                    </li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="booking-wrapper">
        <div class="booking-card">
            <div class="booking-header">
                <h1><i class="fas fa-calendar-check"></i> Đặt Lịch Khám</h1>
                <p>Hoàn thành các bước đơn giản để đặt lịch khám</p>
            </div>

            <div class="booking-body">
                <div class="step-progress-wrapper">
                    <div class="step-indicator">
                        <div class="progress-line" id="progressLine"></div>
                        <div class="step active" data-step="1">
                            <div class="step-circle">1</div>
                            <div class="step-label">Gói Khám</div>
                        </div>
                        <div class="step" data-step="2">
                            <div class="step-circle">2</div>
                            <div class="step-label">Khoa</div>
                        </div>
                        <div class="step" data-step="3">
                            <div class="step-circle">3</div>
                            <div class="step-label">Chuyên Khoa</div>
                        </div>
                        <div class="step" data-step="4">
                            <div class="step-circle">4</div>
                            <div class="step-label">Ngày & Bác Sĩ</div>
                        </div>
                        <div class="step" data-step="5">
                            <div class="step-circle">5</div>
                            <div class="step-label">Giờ Khám</div>
                        </div>
                        <div class="step" data-step="6">
                            <div class="step-circle">6</div>
                            <div class="step-label">Xác Nhận</div>
                        </div>
                    </div>
                </div>

                <div class="section active" id="step1">
                    <h2 class="section-title">Chọn Gói Khám</h2>
                    <div class="selection-grid" id="packageGrid"></div>
                    <div class="nav-buttons">
                        <button class="btn-custom btn-prev" style="visibility: hidden">
                            <i class="fas fa-arrow-left"></i> Quay Lại
                        </button>
                        <button class="btn-custom btn-next" id="btnStep1Next" disabled>
                            Tiếp Theo <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="section" id="step2">
                    <h2 class="section-title">Chọn Khoa Khám</h2>
                    <div class="selection-grid" id="departmentGrid"></div>
                    <div class="nav-buttons">
                        <button class="btn-custom btn-prev" onclick="goToStep(1)">
                            <i class="fas fa-arrow-left"></i> Quay Lại
                        </button>
                        <button class="btn-custom btn-next" id="btnStep2Next" disabled>
                            Tiếp Theo <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="section" id="step3">
                    <h2 class="section-title">Chọn Chuyên Khoa</h2>
                    <div class="selection-grid" id="specialtyGrid"></div>
                    <div class="nav-buttons">
                        <button class="btn-custom btn-prev" onclick="goToStep(2)">
                            <i class="fas fa-arrow-left"></i> Quay Lại
                        </button>
                        <button class="btn-custom btn-next" id="btnStep3Next" disabled>
                            Tiếp Theo <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="section" id="step4">
                    <h2 class="section-title">Chọn Ngày Khám</h2>
                    <div class="mb-4">
                        <input type="date" class="form-control" id="appointmentDate">
                    </div>
                    <h2 class="section-title">Chọn Bác Sĩ</h2>
                    <div class="doctor-grid" id="doctorGrid"></div>
                    <div class="nav-buttons">
                        <button class="btn-custom btn-prev" onclick="goToStep(3)">
                            <i class="fas fa-arrow-left"></i> Quay Lại
                        </button>
                        <button class="btn-custom btn-next" id="btnStep4Next" disabled>
                            Tiếp Theo <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="section" id="step5">
                    <h2 class="section-title">Chọn Buổi</h2>
                    <div class="shift-selector" id="shiftSelector"></div>
                    <h2 class="section-title">Chọn Giờ Khám</h2>
                    <div class="time-slots" id="timeSlots"></div>
                    <div class="nav-buttons">
                        <button class="btn-custom btn-prev" onclick="goToStep(4)">
                            <i class="fas fa-arrow-left"></i> Quay Lại
                        </button>
                        <button class="btn-custom btn-next" id="btnStep5Next" disabled>
                            Tiếp Theo <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <div class="section" id="step6">
                    <h2 class="section-title">Xác Nhận Thông Tin</h2>
                    <div class="summary-card" id="summaryCard"></div>
                    <div class="mb-4">
                        <label class="form-label">Ghi chú (không bắt buộc)</label>
                        <textarea class="form-control" rows="4" id="notes" placeholder="Nhập ghi chú hoặc yêu cầu đặc biệt..."></textarea>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn-custom btn-prev" onclick="goToStep(5)">
                            <i class="fas fa-arrow-left"></i> Quay Lại
                        </button>
                        <button class="btn-custom btn-submit" onclick="submitBooking()">
                            <i class="fas fa-check-circle"></i> Xác Nhận Đặt Lịch
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api-config.js"></script>
    
    <script src="assets/js/common.js"></script>

    <script>

        // State quản lý booking
        const bookingState = {
            packageId: null,
            departmentId: null,
            specialtyId: null,
            date: null,
            doctorId: null,
            shiftId: null,
            slotId: null,
            patientId: null
        };

        let currentStep = 1;

        // Khởi tạo
        document.addEventListener('DOMContentLoaded', function() {
            // Common.js sẽ tự động load Header
            checkAuth(); // Giữ hàm này để lấy patientId cho luồng đặt lịch
            loadPackages();
            setupDateInput();
            updateStepProgress(currentStep);
            
            // Check URL params cho package
            const urlParams = new URLSearchParams(window.location.search);
            const packageParam = urlParams.get('package');
            if (packageParam) {
                bookingState.packageId = parseInt(packageParam);
            }
        });

        window.addEventListener('resize', () => updateStepProgress(currentStep));

        // Kiểm tra đăng nhập (Đã chỉnh sửa để tương thích với Header mới)
        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE_PATIENT}/check-auth.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (!data.success || data.role !== 'benhnhan') {
                    showAlert('error', 'Vui lòng đăng nhập với tài khoản bệnh nhân để đặt lịch!');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 500);
                    return;
                }
                
                bookingState.patientId = data.patientId;
                
            } catch (error) {
                console.error('Auth error:', error);
                showAlert('error', 'Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại!');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
            }
        }

        // Setup date input - chỉ cho phép chọn ngày từ hôm nay
        function setupDateInput() {
            const dateInput = document.getElementById('appointmentDate');
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
            
            dateInput.addEventListener('change', function() {
                if (this.value && bookingState.specialtyId) {
                    bookingState.date = this.value;
                    loadAvailableDoctors();
                }
            });
        }

        // === LOAD DATA FUNCTIONS ===

        // Load gói khám
        async function loadPackages() {
            try {
                const response = await fetch(`${API_BASE_PATIENT}/get-packages.php`);
                const data = await response.json();
                
                if (data.success) {
                    renderPackages(data.data);
                    
                    // Auto-select nếu có packageId từ URL
                    if (bookingState.packageId) {
                        setTimeout(() => selectPackage(bookingState.packageId), 100);
                    }
                }
            } catch (error) {
                console.error('Error loading packages:', error);
            }
        }

        // Load khoa
        async function loadDepartments() {
            try {
                const response = await fetch(`${API_BASE_PATIENT}/get-departments.php`);
                const data = await response.json();
                
                if (data.success) {
                    renderDepartments(data.data);
                }
            } catch (error) {
                console.error('Error loading departments:', error);
            }
        }

        // Load chuyên khoa theo khoa
        async function loadSpecialties(departmentId) {
            try {
                const response = await fetch(`${API_BASE_PATIENT}/get-specialties.php?maKhoa=${departmentId}`);
                const data = await response.json();
                
                if (data.success) {
                    renderSpecialties(data.data);
                }
            } catch (error) {
                console.error('Error loading specialties:', error);
            }
        }

        // Load bác sĩ khả dụng theo ngày và chuyên khoa
        async function loadAvailableDoctors() {
            const container = document.getElementById('doctorGrid');
            container.innerHTML = '<div class="loading"><div class="spinner-border"></div><p>Đang tải...</p></div>';
            
            try {
                const response = await fetch(
                    `${API_BASE_PATIENT}/get-available-doctors.php?maChuyenKhoa=${bookingState.specialtyId}&ngayKham=${bookingState.date}`
                );
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    renderDoctors(data.data);
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-user-md"></i><p>Không có bác sĩ khả dụng trong ngày này</p></div>';
                }
            } catch (error) {
                console.error('Error loading doctors:', error);
                container.innerHTML = '<div class="empty-state text-danger"><i class="fas fa-exclamation-circle"></i><p>Lỗi tải dữ liệu</p></div>';
            }
        }

        // Load ca làm việc khả dụng
        async function loadShifts() {
            try {
                const response = await fetch(
                    `${API_BASE_PATIENT}/get-available-shifts.php?maBacSi=${bookingState.doctorId}&ngayKham=${bookingState.date}`
                );
                const data = await response.json();
                
                if (data.success) {
                    renderShifts(data.data);
                }
            } catch (error) {
                console.error('Error loading shifts:', error);
            }
        }

        // Load suất khám khả dụng
        async function loadAvailableSlots(shiftId) {
            const container = document.getElementById('timeSlots');
            container.innerHTML = '<div class="loading"><div class="spinner-border"></div></div>';
            
            try {
                const response = await fetch(
                    `${API_BASE_PATIENT}/get-available-slots.php?maBacSi=${bookingState.doctorId}&ngayKham=${bookingState.date}&maCa=${shiftId}`
                );
                const data = await response.json();
                
                if (data.success) {
                    renderTimeSlots(data.data);
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-clock"></i><p>Không có suất khám khả dụng</p></div>';
                }
            } catch (error) {
                console.error('Error loading slots:', error);
                container.innerHTML = '<div class="empty-state text-danger"><i class="fas fa-exclamation-circle"></i><p>Lỗi tải dữ liệu</p></div>';
            }
        }

        // === RENDER FUNCTIONS ===

        function renderPackages(packages) {
            const container = document.getElementById('packageGrid');
            container.innerHTML = packages.map(pkg => `
                <div class="selection-card" data-id="${pkg.maGoi}" onclick="selectPackage(${pkg.maGoi})">
                    <div class="card-icon"><i class="fas ${pkg.maGoi === 1 ? 'fa-heartbeat' : 'fa-user-md'}"></i></div>
                    <div class="card-title">${pkg.tenGoi}</div>
                    <div class="card-subtitle">${Number(pkg.gia).toLocaleString('vi-VN')}đ</div>
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                </div>
            `).join('');
        }

        function renderDepartments(departments) {
            const container = document.getElementById('departmentGrid');
            container.innerHTML = departments.map(dept => `
                <div class="selection-card" data-id="${dept.maKhoa}" onclick="selectDepartment('${dept.maKhoa}')">
                    <div class="card-icon"><i class="fas fa-hospital"></i></div>
                    <div class="card-title">${dept.tenKhoa}</div>
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                </div>
            `).join('');
        }

        function renderSpecialties(specialties) {
            const container = document.getElementById('specialtyGrid');
            container.innerHTML = specialties.map(spec => `
                <div class="selection-card" data-id="${spec.maChuyenKhoa}" onclick="selectSpecialty('${spec.maChuyenKhoa}')">
                    <div class="card-icon"><i class="fas fa-stethoscope"></i></div>
                    <div class="card-title">${spec.tenChuyenKhoa}</div>
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                </div>
            `).join('');
        }

        function renderDoctors(doctors) {
            const container = document.getElementById('doctorGrid');
            container.innerHTML = doctors.map(doc => {
                const unavailableClass = doc.available ? '' : 'disabled';
                const unavailableBadge = doc.available ? '' : '<div style="background: #ff4d4f; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; margin-top: 8px;">Không khả dụng</div>';
                const onclick = doc.available ? `onclick="selectDoctor('${doc.maBacSi}')"` : '';
                
                return `
                <div class="doctor-card ${unavailableClass}" data-id="${doc.maBacSi}" ${onclick} style="${doc.available ? '' : 'opacity: 0.5; cursor: not-allowed;'}">
                    <div class="doctor-header">
                        <div class="doctor-avatar"><i class="fas fa-user-md"></i></div>
                        <div>
                            <div class="doctor-name">${doc.tenBacSi}</div>
                            <div class="doctor-specialty">${doc.tenChuyenKhoa || 'Đa khoa'}</div>
                        </div>
                    </div>
                    ${unavailableBadge}
                </div>
                `;
            }).join('');
        }

        function renderShifts(shifts) {
            const container = document.getElementById('shiftSelector');
            container.innerHTML = shifts.map(shift => {
                // --- THÊM DÒNG NÀY ĐỂ ĐỔI TÊN ---
                let tenHienThi = shift.tenCa.replace('Ca', 'Buổi'); // Ví dụ: Ca Sáng -> Buổi Sáng
                // Hoặc nếu muốn kiểm soát kỹ hơn:
                // let tenHienThi = shift.maCa === 1 ? 'Buổi sáng' : 'Buổi chiều';

                return `
                <div class="shift-btn" data-shift="${shift.maCa}" onclick="selectShift(${shift.maCa})">
                    <i class="fas ${shift.maCa === 1 ? 'fa-sun' : 'fa-cloud-sun'}"></i> ${tenHienThi}<br> 
                    <small>${shift.gioBatDau.substring(0, 5)} - ${shift.gioKetThuc.substring(0, 5)}</small>
                </div>
                `;
            }).join('');
        }

        function renderTimeSlots(slots) {
            const container = document.getElementById('timeSlots');
            container.innerHTML = slots.map(slot => {
                const unavailableClass = slot.available ? '' : 'disabled';
                const onclick = slot.available ? `onclick="selectSlot(${slot.maSuat})"` : '';
                const unavailableText = slot.available ? '' : '<small style="color: #ff4d4f; display: block; margin-top: 4px;">Đã đặt</small>';
                
                return `
                <div class="time-slot ${unavailableClass}" 
                    data-slot="${slot.maSuat}" 
                    ${onclick}>
                    <i class="fas fa-clock"></i>
                    <div>${slot.gioBatDau.substring(0, 5)} - ${slot.gioKetThuc.substring(0, 5)}</div>
                    ${unavailableText}
                </div>
                `;
            }).join('');
        }

        // === SELECTION HANDLERS ===

        function selectPackage(packageId) {
            bookingState.packageId = packageId;
            document.querySelectorAll('#packageGrid .selection-card').forEach(card => {
                card.classList.toggle('selected', parseInt(card.dataset.id) === packageId);
            });
            document.getElementById('btnStep1Next').disabled = false;
        }

        function selectDepartment(departmentId) {
            bookingState.departmentId = departmentId;
            bookingState.specialtyId = null;
            bookingState.doctorId = null;
            bookingState.date = null;
            bookingState.shiftId = null;
            bookingState.slotId = null;
            
            document.querySelectorAll('#departmentGrid .selection-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.id === departmentId);
            });
            
            loadSpecialties(departmentId);
            document.getElementById('btnStep2Next').disabled = false;
        }

        function selectSpecialty(specialtyId) {
            bookingState.specialtyId = specialtyId;
            bookingState.doctorId = null;
            bookingState.date = null;
            bookingState.shiftId = null;
            bookingState.slotId = null;
            
            document.querySelectorAll('#specialtyGrid .selection-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.id === specialtyId);
            });
            
            document.getElementById('btnStep3Next').disabled = false;
        }

        function selectDoctor(doctorId) {
            // Kiểm tra xem bác sĩ có khả dụng không
            const doctorCard = document.querySelector(`#doctorGrid .doctor-card[data-id="${doctorId}"]`);
            if (doctorCard && doctorCard.classList.contains('disabled')) {
                showAlert('error', 'Bác sĩ này không khả dụng trong ngày đã chọn. Vui lòng chọn bác sĩ khác!');
                return;
            }
            
            bookingState.doctorId = doctorId;
            bookingState.shiftId = null;
            bookingState.slotId = null;
            
            document.querySelectorAll('#doctorGrid .doctor-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.id === doctorId);
            });
            
            loadShifts();
            document.getElementById('btnStep4Next').disabled = false;
        }

        function selectShift(shiftId) {
            bookingState.shiftId = shiftId;
            bookingState.slotId = null;
            
            document.querySelectorAll('#shiftSelector .shift-btn').forEach(btn => {
                btn.classList.toggle('selected', parseInt(btn.dataset.shift) === shiftId);
            });
            
            loadAvailableSlots(shiftId);
            document.getElementById('btnStep5Next').disabled = true;
        }

        function selectSlot(slotId) {
            // Kiểm tra xem suất có khả dụng không
            const slotCard = document.querySelector(`#timeSlots .time-slot[data-slot="${slotId}"]`);
            if (slotCard && slotCard.classList.contains('disabled')) {
                showAlert('error', 'Suất khám này đã được đặt. Vui lòng chọn suất khác!');
                return;
            }
            
            bookingState.slotId = slotId;
            
            document.querySelectorAll('#timeSlots .time-slot').forEach(slot => {
                slot.classList.toggle('selected', parseInt(slot.dataset.slot) === slotId);
            });
            
            document.getElementById('btnStep5Next').disabled = false;
        }

        // === NAVIGATION ===

        function goToStep(stepNumber) {
            currentStep = stepNumber;

            // Hide all sections
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('step' + stepNumber).classList.add('active');
            
            // Update step indicators
            const steps = document.querySelectorAll('.step');
            steps.forEach(s => {
                s.classList.remove('active', 'completed');
                const step = parseInt(s.dataset.step);
                if (step < stepNumber) s.classList.add('completed');
                if (step === stepNumber) s.classList.add('active');
            });

            updateStepProgress(stepNumber);
            
            // Load data if needed
            if (stepNumber === 2 && !document.querySelector('#departmentGrid .selection-card')) {
                loadDepartments();
            }
        }

        function updateStepProgress(stepNumber) {
            const indicator = document.querySelector('.step-indicator');
            const progressLine = document.getElementById('progressLine');
            const steps = document.querySelectorAll('.step');
            const firstCircle = steps[0]?.querySelector('.step-circle');
            const activeCircle = document.querySelector(`.step[data-step="${stepNumber}"] .step-circle`);

            if (!indicator || !progressLine || !firstCircle || !activeCircle) return;

            const indicatorRect = indicator.getBoundingClientRect();
            const firstRect = firstCircle.getBoundingClientRect();
            const activeRect = activeCircle.getBoundingClientRect();

            const startX = (firstRect.left - indicatorRect.left) + (firstRect.width / 2);
            const endX = (activeRect.left - indicatorRect.left) + (activeRect.width / 2);

            progressLine.style.left = `${startX}px`;
            progressLine.style.width = `${Math.max(0, endX - startX)}px`;

            if (window.innerWidth <= 768) {
                activeCircle.closest('.step')?.scrollIntoView({
                    behavior: 'smooth',
                    inline: 'center',
                    block: 'nearest'
                });
            }
        }

        // Button event listeners
        document.getElementById('btnStep1Next').addEventListener('click', () => goToStep(2));
        document.getElementById('btnStep2Next').addEventListener('click', () => goToStep(3));
        document.getElementById('btnStep3Next').addEventListener('click', () => goToStep(4));
        document.getElementById('btnStep4Next').addEventListener('click', () => goToStep(5));
        document.getElementById('btnStep5Next').addEventListener('click', () => {
            renderSummary();
            goToStep(6);
        });

        // === SUMMARY & SUBMIT ===

        async function renderSummary() {
            const container = document.getElementById('summaryCard');
            
            try {
                // Fetch all needed data
                const [packageRes, deptRes, specRes, docRes, shiftRes, slotRes] = await Promise.all([
                    fetch(`${API_BASE_PATIENT}/get-packages.php`),
                    fetch(`${API_BASE_PATIENT}/get-departments.php`),
                    fetch(`${API_BASE_PATIENT}/get-specialties.php?maKhoa=${bookingState.departmentId}`),
                    fetch(`${API_BASE_PATIENT}/get-available-doctors.php?maChuyenKhoa=${bookingState.specialtyId}&ngayKham=${bookingState.date}`),
                    fetch(`${API_BASE_PATIENT}/get-available-shifts.php?maBacSi=${bookingState.doctorId}&ngayKham=${bookingState.date}`),
                    fetch(`${API_BASE_PATIENT}/get-available-slots.php?maBacSi=${bookingState.doctorId}&ngayKham=${bookingState.date}&maCa=${bookingState.shiftId}`)
                ]);
                
                const packages = (await packageRes.json()).data;
                const departments = (await deptRes.json()).data;
                const specialties = (await specRes.json()).data;
                const doctors = (await docRes.json()).data;
                const shifts = (await shiftRes.json()).data;
                const slots = (await slotRes.json()).data;
                
                const pkg = packages.find(p => p.maGoi == bookingState.packageId);
                const dept = departments.find(d => d.maKhoa === bookingState.departmentId);
                const spec = specialties.find(s => s.maChuyenKhoa === bookingState.specialtyId);
                const doc = doctors.find(d => d.maBacSi === bookingState.doctorId);
                const shift = shifts.find(s => s.maCa === bookingState.shiftId);
                const slot = slots.find(s => s.maSuat === bookingState.slotId);

                if (!slot || !slot.available) {
                    showAlert('error', 'Rất tiếc! Suất khám này vừa có người khác đặt trong lúc bạn đang thao tác. Vui lòng chọn giờ khác.');
                    goToStep(5);
                    return;
                }
                container.innerHTML = `
                    <div class="summary-item">
                        <div class="summary-label">Gói Khám:</div>
                        <div class="summary-value">${pkg.tenGoi} - ${Number(pkg.gia).toLocaleString('vi-VN')}đ</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Khoa:</div>
                        <div class="summary-value">${dept.tenKhoa}</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Chuyên Khoa:</div>
                        <div class="summary-value">${spec.tenChuyenKhoa}</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Bác Sĩ:</div>
                        <div class="summary-value">${doc.tenBacSi}</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Ngày Khám:</div>
                        <div class="summary-value">${formatDate(bookingState.date)}</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Buổi:</div>
                        <div class="summary-value">${shift.tenCa.replace('Ca', 'Buổi')}</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-label">Giờ Khám:</div>
                        <div class="summary-value">${slot.gioBatDau.substring(0, 5)} - ${slot.gioKetThuc.substring(0, 5)}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error rendering summary:', error);
            }
        }

        async function submitBooking() {
            const notes = document.getElementById('notes').value;
            
            const bookingData = {
                maBenhNhan: bookingState.patientId,
                maBacSi: bookingState.doctorId,
                ngayKham: bookingState.date,
                maCa: bookingState.shiftId,
                maSuat: bookingState.slotId,
                maGoi: bookingState.packageId,
                ghiChu: notes
            };
            
            try {
                const response = await fetch(`${API_BASE_PATIENT}/create-appointment.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('success', 'Đặt lịch thành công!');
                    setTimeout(() => {
                        window.location.href = 'lich-kham-ca-nhan.html';
                    }, 500);
                } else {
                    showAlert('error', 'Đặt lịch thất bại: ' + data.message);
                }
            } catch (error) {
                console.error('Error submitting booking:', error);
                showAlert('error', 'Có lỗi xảy ra. Vui lòng thử lại!');
            }
        }

        // Helper function
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()}`;
        }
        
        function ensureShowAlertStyles() {
            if (document.getElementById('showAlertLoginStyle')) return;

            const style = document.createElement('style');
            style.id = 'showAlertLoginStyle';
            style.textContent = `
                .alert-custom {
                    padding: 12px 15px;
                    border-radius: 8px;
                    margin-bottom: 15px;
                    font-size: 0.85rem;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
                }
                .alert-custom.alert-success {
                    background: #d1fae5;
                    color: #065f46;
                    border-left: 4px solid #10b981;
                }
                .alert-custom.alert-danger {
                    background: #f8d7da;
                    color: #721c24;
                    border-left: 4px solid #dc3545;
                }
                @keyframes showAlertSlideIn {
                    from { transform: translateX(400px); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes showAlertSlideOut {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(400px); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        }

        function showAlert(type, message) {
            ensureShowAlertStyles();

            const alertDiv = document.createElement('div');
            alertDiv.className = `alert-custom alert-${type === 'success' ? 'success' : 'danger'} position-fixed`;
            alertDiv.style.cssText = 'top: 80px; right: 20px; z-index: 99999; min-width: 320px; max-width: 420px; animation: showAlertSlideIn 0.3s;';

            const icon = document.createElement('i');
            icon.className = `fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}`;

            const content = document.createElement('span');
            content.textContent = message;

            alertDiv.appendChild(icon);
            alertDiv.appendChild(content);
            document.body.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.style.animation = 'showAlertSlideOut 0.3s';
                setTimeout(() => alertDiv.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
